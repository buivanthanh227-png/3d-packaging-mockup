<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO MOCKUP 3D STUDIO V2.0 PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
.glass{background:rgba(15,23,42,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}
#canvas2D,#threeCanvas{width:100%;height:100%;display:block;background:#1e293b}
.mode-btn.active{background:#0284c7;color:white}
input,select,button{outline:none}
</style>
</head>
<body class="h-screen flex flex-col">
<header class="glass px-4 py-2 flex items-center justify-between shrink-0">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded bg-sky-500 flex items-center justify-center font-bold">3D</div>
    <div>
      <h1 class="font-bold text-lg">AUTO MOCKUP 3D STUDIO <span class="text-xs bg-emerald-500/30 text-emerald-300 px-2 py-0.5 rounded-full">V2.0 PRO</span></h1>
      <p class="text-xs text-slate-400">2D Dieline → Artwork → 3D Carton • RSC / Mailer / Lid-Base</p>
    </div>
  </div>
  <div class="flex gap-2">
    <button id="mode2D" class="mode-btn active px-4 py-1.5 rounded text-sm">2D Bản trải</button>
    <button id="mode3D" class="mode-btn px-4 py-1.5 rounded text-sm bg-slate-700">3D Mockup</button>
    <button id="themeBtn" class="px-3 py-1.5 rounded text-sm bg-white/10">Dark/Light</button>
  </div>
</header>

<div class="flex-1 flex overflow-hidden">
  <!-- Left controls -->
  <aside class="w-80 glass border-r border-white/10 p-3 overflow-y-auto shrink-0 text-sm">
    <h3 class="text-xs font-bold text-sky-300 uppercase mb-2">Kích thước (mm)</h3>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div><label class="text-xs text-slate-400">Dài L</label><input id="L" type="number" value="400" class="w-full bg-slate-800 rounded px-2 py-1"></div>
      <div><label class="text-xs text-slate-400">Rộng W</label><input id="W" type="number" value="250" class="w-full bg-slate-800 rounded px-2 py-1"></div>
      <div><label class="text-xs text-slate-400">Cao H</label><input id="H" type="number" value="200" class="w-full bg-slate-800 rounded px-2 py-1"></div>
      <div><label class="text-xs text-slate-400">Độ dày</label><input id="thick" type="number" value="4" step="0.5" class="w-full bg-slate-800 rounded px-2 py-1"></div>
    </div>
    <div class="mb-3">
      <label class="text-xs text-slate-400">Kiểu thùng</label>
      <select id="boxType" class="w-full bg-slate-800 rounded px-2 py-1 mt-1">
        <option value="rsc">RSC - Carton thường</option>
        <option value="mailer">Mailer Box (nắp gập)</option>
        <option value="lidbase">Lid & Base (âm dương)</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="text-xs text-slate-400">Màu kraft</label>
      <input id="paperColor" type="color" value="#c9a36a" class="w-full h-8 mt-1 rounded">
    </div>

    <h3 class="text-xs font-bold text-sky-300 uppercase mb-2 mt-4">Nội dung 2D</h3>
    <div class="mb-2">
      <label class="text-xs text-slate-400">Upload Artwork</label>
      <input id="artFile" type="file" accept="image/*" class="w-full text-xs mt-1">
    </div>
    <div class="flex gap-2 mb-3">
      <button id="textBtn" class="flex-1 py-1.5 bg-slate-700 rounded text-xs">Thêm Text</button>
      <button id="eraserBtn" class="flex-1 py-1.5 bg-slate-700 rounded text-xs">Tẩy</button>
    </div>
    <div class="flex gap-2 mb-4">
      <button id="undoBtn" class="flex-1 py-1 bg-slate-700 rounded text-xs">Undo</button>
      <button id="redoBtn" class="flex-1 py-1 bg-slate-700 rounded text-xs">Redo</button>
    </div>

    <h3 class="text-xs font-bold text-sky-300 uppercase mb-2">Điều khiển 3D</h3>
    <div class="mb-2">
      <label class="text-xs">Mở nắp trên <span id="topVal">0°</span></label>
      <input id="topOpen" type="range" min="0" max="110" value="0" class="w-full">
    </div>
    <div class="mb-3">
      <label class="text-xs">Mở cánh đáy <span id="botVal">0°</span></label>
      <input id="botOpen" type="range" min="0" max="90" value="0" class="w-full">
    </div>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <button id="presetOpen" class="py-1.5 bg-sky-600 rounded text-xs">Mở tự nhiên</button>
      <button id="presetClose" class="py-1.5 bg-slate-600 rounded text-xs">Đóng kín</button>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <button id="exportPng" class="py-2 bg-emerald-600 rounded text-xs font-medium">PNG 4K</button>
      <button id="exportGlb" class="py-2 bg-violet-600 rounded text-xs font-medium">Xuất GLB</button>
    </div>
    <p class="text-xs text-slate-500 mt-3">Quy trình: chỉnh 2D → bấm "3D Mockup" để dựng thùng carton từ nội dung.</p>
  </aside>

  <!-- Stage -->
  <main class="flex-1 relative bg-slate-900">
    <canvas id="canvas2D" class="absolute inset-0"></canvas>
    <div id="threeWrap" class="absolute inset-0 hidden">
      <canvas id="threeCanvas"></canvas>
    </div>
    <div class="absolute bottom-3 left-3 text-xs opacity-60 pointer-events-none">Chuột giữa pan • Scroll zoom • 2D: kéo artwork/text</div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ===== STATE =====
let currentMode = '2d';
let scene, camera, renderer, controls, cartonGroup;
let topFlaps = [], botFlaps = [];
let loadedArt = null;
let textLayers = [];
let history = [], histIndex = -1;
let zoom2D = 1, pan2D = {x:0,y:0};
let canvas2D, ctx2D;

// ===== 2D =====
function init2D() {
  canvas2D = document.getElementById('canvas2D');
  ctx2D = canvas2D.getContext('2d');
  resize2D();
  window.addEventListener('resize', resize2D);
  canvas2D.addEventListener('wheel', e => {
    e.preventDefault();
    zoom2D = Math.max(0.3, Math.min(3, zoom2D + (e.deltaY > 0 ? -0.1 : 0.1)));
    draw2D();
  });
  draw2D();
}

function resize2D() {
  const r = canvas2D.parentElement.getBoundingClientRect();
  canvas2D.width = r.width;
  canvas2D.height = r.height;
  draw2D();
}

function getDims() {
  return {
    L: +document.getElementById('L').value,
    W: +document.getElementById('W').value,
    H: +document.getElementById('H').value,
    T: +document.getElementById('thick').value
  };
}

function draw2D() {
  if (currentMode !== '2d') return;
  const d = getDims();
  const w = canvas2D.width, h = canvas2D.height;
  ctx2D.clearRect(0,0,w,h);
  ctx2D.save();
  ctx2D.translate(w/2 + pan2D.x, h/2 + pan2D.y);
  ctx2D.scale(zoom2D, zoom2D);

  const scale = Math.min(w*0.7 / (d.L*2 + d.W*2 + 40), h*0.7 / (d.H + d.W));
  const totalW = (d.L + d.W) * 2 + 40;
  const totalH = d.H + d.W;
  const sx = -totalW * scale / 2;
  const sy = -totalH * scale / 2;

  // Simple RSC net
  ctx2D.fillStyle = document.getElementById('paperColor').value;
  ctx2D.fillRect(sx, sy, totalW*scale, totalH*scale);

  // Draw panels outline
  ctx2D.strokeStyle = '#334155';
  ctx2D.lineWidth = 1.5 / zoom2D;
  ctx2D.strokeRect(sx, sy, totalW*scale, totalH*scale);

  // Artwork
  if (loadedArt) {
    ctx2D.drawImage(loadedArt, sx + 20*scale, sy + 20*scale, (totalW-40)*scale, (totalH-40)*scale);
  }

  // Text layers
  textLayers.forEach(t => {
    ctx2D.fillStyle = t.color || '#111';
    ctx2D.font = `bold ${t.size||24}px sans-serif`;
    ctx2D.fillText(t.text, sx + t.x*scale, sy + t.y*scale);
  });

  ctx2D.restore();
}

// ===== 3D =====
function init3D() {
  const wrap = document.getElementById('threeWrap');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);
  scene.fog = new THREE.Fog(0x0f172a, 6, 20);

  camera = new THREE.PerspectiveCamera(42, wrap.clientWidth/wrap.clientHeight, 0.1, 50);
  camera.position.set(2.8, 1.8, 3.6);

  renderer = new THREE.WebGLRenderer({canvas: document.getElementById('threeCanvas'), antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Studio lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  const key = new THREE.DirectionalLight(0xffffff, 1.15);
  key.position.set(4, 5, 3);
  key.castShadow = true;
  key.shadow.mapSize.set(2048,2048);
  scene.add(key);
  scene.add(new THREE.DirectionalLight(0xaaccff, 0.4).position.set(-3,2,-1));

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(12,12), new THREE.ShadowMaterial({opacity:0.3}));
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.9;
  ground.receiveShadow = true;
  scene.add(ground);

  window.addEventListener('resize', () => {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  });
}

function createKraftMat(hex) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hex;
  ctx.fillRect(0,0,512,512);
  for(let i=0;i<6000;i++){
    ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.07})`;
    ctx.fillRect(Math.random()*512, Math.random()*512, 1,1);
  }
  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({
    map, roughness:0.85, metalness:0.01, side:THREE.DoubleSide
  });
}

function disposeCarton() {
  if (!cartonGroup) return;
  cartonGroup.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (o.material.map) o.material.map.dispose();
      o.material.dispose();
    }
  });
  scene.remove(cartonGroup);
}

function build3D() {
  disposeCarton();
  cartonGroup = new THREE.Group();
  scene.add(cartonGroup);
  topFlaps = []; botFlaps = [];

  const d = getDims();
  const L = d.L/1000, W = d.W/1000, H = d.H/1000;
  const mat = createKraftMat(document.getElementById('paperColor').value);
  const type = document.getElementById('boxType').value;

  // Body
  const body = new THREE.Mesh(new THREE.BoxGeometry(L, H, W), mat);
  body.castShadow = body.receiveShadow = true;
  cartonGroup.add(body);

  // Simple top flaps for RSC-style
  const flapDepth = W * 0.45;
  [-1,1].forEach(s => {
    const f = new THREE.Mesh(new THREE.BoxGeometry(L*0.96, 0.004, flapDepth), mat);
    f.position.set(0, H/2 + 0.002, s*(W/2 + flapDepth/2));
    f.castShadow = true;
    f.userData.side = s;
    cartonGroup.add(f);
    topFlaps.push(f);
  });

  updateFlaps();
}

function updateFlaps() {
  const t = +document.getElementById('topOpen').value;
  const b = +document.getElementById('botOpen').value;
  document.getElementById('topVal').textContent = t+'°';
  document.getElementById('botVal').textContent = b+'°';
  const tr = THREE.MathUtils.degToRad(t);
  topFlaps.forEach(f => {
    f.rotation.x = f.userData.side > 0 ? -tr : tr;
  });
}

function animate() {
  requestAnimationFrame(animate);
  if (currentMode === '3d' && controls) {
    controls.update();
    renderer.render(scene, camera);
  }
}

// ===== MODE SWITCH =====
function setMode(m) {
  currentMode = m;
  document.getElementById('canvas2D').style.display = m==='2d' ? 'block' : 'none';
  document.getElementById('threeWrap').style.display = m==='3d' ? 'block' : 'none';
  document.getElementById('mode2D').classList.toggle('active', m==='2d');
  document.getElementById('mode3D').classList.toggle('active', m==='3d');
  if (m === '3d') {
    if (!renderer) init3D();
    build3D();
    renderer.setSize(document.getElementById('threeWrap').clientWidth, document.getElementById('threeWrap').clientHeight);
  } else {
    draw2D();
  }
}

// ===== EVENTS =====
document.getElementById('mode2D').onclick = () => setMode('2d');
document.getElementById('mode3D').onclick = () => setMode('3d');

['L','W','H','thick','paperColor','boxType'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    if (currentMode==='2d') draw2D();
    else build3D();
  });
});

document.getElementById('artFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => { loadedArt = img; draw2D(); };
  img.src = URL.createObjectURL(f);
};

document.getElementById('textBtn').onclick = () => {
  const txt = prompt('Nhập text:', 'THƯƠNG HIỆU');
  if (txt) {
    textLayers.push({text:txt, x:100, y:80, size:28, color:'#111'});
    draw2D();
  }
};

document.getElementById('topOpen').oninput = updateFlaps;
document.getElementById('botOpen').oninput = updateFlaps;
document.getElementById('presetOpen').onclick = () => {
  document.getElementById('topOpen').value = 75;
  updateFlaps();
};
document.getElementById('presetClose').onclick = () => {
  document.getElementById('topOpen').value = 0;
  updateFlaps();
};

document.getElementById('exportPng').onclick = () => {
  if (currentMode !== '3d') setMode('3d');
  setTimeout(() => {
    const link = document.createElement('a');
    link.download = 'carton-mockup-4k.png';
    link.href = renderer.domElement.toDataURL('image/png');
    link.click();
  }, 100);
};

document.getElementById('exportGlb').onclick = () => {
  if (!cartonGroup) return;
  const exp = new GLTFExporter();
  exp.parse(cartonGroup, gltf => {
    const blob = new Blob([gltf], {type:'model/gltf-binary'});
    const a = document.createElement('a');
    a.download = 'carton.glb';
    a.href = URL.createObjectURL(blob);
    a.click();
  }, {binary:true});
};

document.getElementById('themeBtn').onclick = () => {
  document.body.classList.toggle('bg-slate-100');
  document.body.classList.toggle('text-slate-900');
};

// Init
init2D();
animate();
</script>
</body>
</html>
