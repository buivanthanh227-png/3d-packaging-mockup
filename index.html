<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTO MOCKUP 3D - Carton Studio V1.1 PRO</title>
<style>
:root{
  --bg:#0b1120;--panel:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --primary:#0284c7;--primary-hover:#0369a1;--accent:#f97316;--accent-hover:#ea580c;
  --danger:#ef4444;--danger-hover:#dc2626;--success:#10b981;
}
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:var(--ink);font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

/* Banner & Header mới hiện đại, tinh tế */
header{
  background:linear-gradient(125deg, #090d16 0%, #172554 55%, #0c4a6e 100%);
  color:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:2px solid #0284c7;box-shadow:0 4px 16px rgba(2,132,199,0.2);
}
.brand-box{display:flex;align-items:center;gap:14px}
.brand-logo{
  width:42px;height:42px;border-radius:10px;
  background:linear-gradient(135deg, #38bdf8, #0284c7);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(56,189,248,0.4);flex-shrink:0;
}
.brand-title{display:flex;align-items:center;gap:10px;margin:0;font-size:18px;font-weight:800;letter-spacing:.5px;color:#f8fafc}
.ver-pill{background:rgba(16,185,129,0.2);border:1px solid #10b981;color:#34d399;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700}
.brand-sub{color:#94a3b8;font-size:12px;margin-top:2px;display:block}
.author-credit{
  font-size:10.5px;color:#cbd5e1;letter-spacing:.4px;text-align:right;
  background:rgba(255,255,255,0.06);padding:5px 11px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);
}

main{max-width:1800px;margin:auto;padding:14px;display:grid;grid-template-columns:410px minmax(0,1fr);gap:14px}
.panel,.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,0.06)}
.panel{padding:16px;max-height:calc(100vh - 92px);overflow-y:auto}
.panel h2{
  font-size:14px;margin:0 0 12px;color:#0f172a;display:flex;align-items:center;gap:8px;
  font-weight:800;border-bottom:2px solid #e0f2fe;padding-bottom:6px;text-transform:uppercase;letter-spacing:.3px;
}
.section{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}

.field{display:grid;grid-template-columns:1fr 115px;align-items:center;gap:8px;margin:7px 0}
.field label{color:#334155;font-size:13px;font-weight:600}
.field input[type=number],.field select{
  width:100%;padding:6px 9px;border:1px solid #cbd5e1;border-radius:7px;background:#f8fafc;
  color:var(--ink);font-size:13px;font-weight:500;transition:.15s;
}
.field input[type=number]:focus,.field select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(2,132,199,0.15)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-field{display:flex;flex-direction:column;gap:3px}
.mini-field label{font-size:11.5px;color:var(--muted);font-weight:600}
.mini-field input{
  width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:7px;background:#f8fafc;
  font-size:13px;font-weight:500;transition:.15s;
}
.mini-field input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(2,132,199,0.15)}

.file-row{display:flex;gap:6px;align-items:center}
input[type=file]{
  flex:1;font-size:12px;padding:7px;border:1.5px dashed #0284c7;border-radius:8px;
  background:#f0f9ff;cursor:pointer;color:#0369a1;font-weight:600;transition:.15s;
}
input[type=file]:hover{background:#e0f2fe}

/* Nút bấm & hiệu ứng tương tác */
button{
  border:0;border-radius:8px;background:var(--primary);color:#fff;padding:9px 14px;
  font-weight:700;font-size:13px;cursor:pointer;transition:all .15s ease;
  box-shadow:0 2px 6px rgba(2,132,199,0.25);display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
button:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 4px 10px rgba(2,132,199,0.35)}
button:active{transform:scale(0.97) translateY(0)}

button.secondary{background:#e2e8f0;color:#1e293b;box-shadow:none}
button.secondary:hover{background:#cbd5e1;transform:translateY(-1px)}
button.secondary:active{transform:scale(0.97)}

button.danger{background:var(--danger);color:#fff;box-shadow:0 2px 6px rgba(239,68,68,0.25);padding:8px 11px}
button.danger:hover{background:var(--danger-hover)}

button.cta-3d{
  width:100%;background:linear-gradient(135deg, #f97316 0%, #ea580c 100%);
  color:#fff;padding:13px 16px;font-size:14.5px;font-weight:800;letter-spacing:.3px;
  box-shadow:0 4px 14px rgba(234,88,12,0.38);border:1px solid #fb923c;
}
button.cta-3d:hover{background:linear-gradient(135deg, #ea580c 0%, #c2410c 100%);box-shadow:0 6px 18px rgba(234,88,12,0.48)}
button.sm{padding:6px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.stage{min-height:700px;height:calc(100vh - 92px);overflow:hidden;display:flex;flex-direction:column;position:relative}
.toolbar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f8fafc;z-index:2}
.toolbar strong{font-size:13.5px;color:#0f172a}
.toolbar .status{margin-left:auto;color:var(--primary);font-size:12px;font-weight:600;background:#e0f2fe;padding:3px 10px;border-radius:20px}

#viewArea{flex:1;position:relative;background:#0f172a;overflow:hidden;display:flex;align-items:center;justify-content:center}
#dieline2DCanvas{background:#1e293b;cursor:crosshair;box-shadow:0 12px 32px rgba(0,0,0,0.65)}
#threeCanvas{display:none;width:100%;height:100%}

/* Bảng điều khiển nổi thao tác 3D */
.float-panel{
  position:absolute;top:56px;left:14px;background:rgba(255,255,255,0.96);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;padding:13px;width:320px;z-index:10;
  box-shadow:0 10px 28px rgba(15,23,42,0.2);font-size:12.5px;
}
.float-panel h4{margin:0 0 9px 0;font-size:13px;color:var(--primary);display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid #e0f2fe;padding-bottom:5px;font-weight:800}
.float-panel .field{grid-template-columns:1fr 100px;margin:6px 0}

@media(max-width:1024px){
  main{grid-template-columns:1fr}
  .panel{max-height:none}
  .stage{height:580px}
}
</style>
</head>
<body>

<header>
  <div class="brand-box">
    <div class="brand-logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
    </div>
    <div>
      <h1 class="brand-title">AUTO MOCKUP 3D STUDIO <span class="ver-pill">V1.1 PRO</span></h1>
      <span class="brand-sub">Hệ thống mô phỏng bao bì carton 2D & 3D trực quan</span>
    </div>
  </div>
  <div class="author-credit">CÔNG CỤ ĐƯỢC PHÁT TRIỂN TỪ Ý TƯỞNG CỦA BÙI VĂN THANH</div>
</header>

<main>
<aside class="panel">
  <!-- MỤC 1: KÍCH THƯỚC & CẤU TRÚC -->
  <div class="section">
    <h2>1. Kích thước thùng & Kết cấu</h2>
    <div class="grid-2">
      <div class="mini-field"><label>Dài (L), mm</label><input id="L" type="number" min="30" value="545"></div>
      <div class="mini-field"><label>Rộng (W), mm</label><input id="W" type="number" min="30" value="305"></div>
      <div class="mini-field"><label>Cao thân (H), mm</label><input id="H" type="number" min="30" value="410"></div>
      <div class="mini-field"><label>Độ dày sóng, mm</label><input id="thick" type="number" min="1" max="25" step="0.5" value="5"></div>
    </div>
    <div class="field" style="margin-top:8px">
      <label>Mối nối (TS / Lưỡi gà)</label><input id="glueTS" type="number" min="0" value="35">
    </div>
    <div class="grid-2" style="margin-top:6px">
      <div class="mini-field"><label>Cao cánh trên (mm)</label><input id="topFlapH" type="number" min="0" value="155.5"></div>
      <div class="mini-field"><label>Cao cánh đáy (mm)</label><input id="botFlapH" type="number" min="0" value="155.5"></div>
    </div>
    <div class="field" style="margin-top:8px">
      <label>Khe xẻ rãnh (Slot gap)</label><input id="slotGap" type="number" min="0" max="15" value="6">
    </div>

    <div class="field" style="margin-top:6px">
      <label>Cấu trúc sóng giấy</label>
      <select id="fluteLayers">
        <option value="3">Carton 3 lớp (1 sóng)</option>
        <option value="5" selected>Carton 5 lớp (2 sóng)</option>
        <option value="7">Carton 7 lớp (3 sóng)</option>
      </select>
    </div>

    <div class="field" style="margin-top:6px">
      <label>Màu giấy carton</label>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="color" id="paperColorPicker" value="#c6a276" style="width:36px;height:30px;border:1px solid #cbd5e1;border-radius:6px;cursor:pointer;padding:0">
        <select id="paperPreset" style="flex:1">
          <option value="#c6a276">Kraft Vàng Tự Nhiên</option>
          <option value="#d9b382">Kraft Sáng</option>
          <option value="#a78153">Kraft Đậm</option>
          <option value="#f1f3f5">Carton Trắng</option>
        </select>
      </div>
    </div>

    <div class="actions" style="margin-top:10px">
      <button id="updateDielineBtn" style="width:100%">Cập nhật bản trải phẳng 2D (Reset)</button>
    </div>
  </div>

  <!-- MỤC 2: CÀI ĐẶT BĂNG KEO -->
  <div class="section">
    <h2>2. Băng keo niêm phong</h2>
    <div class="field"><label>Bản rộng băng keo (mm)</label><input id="tapeWidthMm" type="number" min="20" max="100" value="60"></div>
    <div class="field"><label>Đoạn gập tràn hông (mm)</label><input id="tapeOverlapMm" type="number" min="0" max="150" value="60"></div>
    <div class="field"><label>Loại & Màu keo</label><select id="tapeMode"><option value="none">Không dán</option><option value="clear">Băng keo trong</option><option value="color">Băng keo màu tùy chỉnh</option></select></div>
    <div id="tapeColorRow" class="field" style="display:none"><label>Chọn màu keo</label><input type="color" id="tapeColorPicker" value="#facc15" style="width:100%;height:28px;border:0;cursor:pointer;padding:0"></div>
  </div>

  <!-- MỤC 3: NẠP FILE & DỰNG 3D -->
  <div class="section">
    <h2>3. File thiết kế & Dựng 3D</h2>
    <div class="file-row">
      <input id="artInput" type="file" accept="image/png,image/jpeg,image/webp,application/pdf">
      <button type="button" class="danger sm" id="clearArtBtn" title="Xóa tệp thiết kế hiện tại">✕ Xóa</button>
    </div>
    
    <div class="actions" style="margin-top:12px; display:flex; flex-direction:column; gap:8px;">
      <button id="build3DBtn" class="cta-3d">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        DỰNG MOCKUP 3D NGAY
      </button>
      <button class="secondary sm" id="switchMode2D_bottom" style="width:100%; padding:9px; font-weight:700;">⬅ Quay lại chỉnh 2D</button>
    </div>
  </div>
</aside>

<section class="stage">
  <div class="toolbar">
    <strong id="stageTitle">Bản trải phẳng 2D (Dieline Studio)</strong>
    <div id="camToolbar" style="display:none;gap:6px">
      <button class="secondary sm" id="camIso">Góc 3/4</button>
      <button class="secondary sm" id="camFront">Mặt chính</button>
      <button class="secondary sm" id="camSide">Mặt hông</button>
      <button class="secondary sm" id="camTop">Nhìn từ trên</button>
      <button class="secondary sm" id="camBottom">Nhìn từ dưới</button>
      <button class="sm" id="saveBtn">Xuất ảnh PNG</button>
    </div>
    <span class="status" id="statusText">Sẵn sàng canh chỉnh 2D</span>
  </div>

  <div id="viewArea">
    <canvas id="dieline2DCanvas"></canvas>
    <div id="threeCanvas"></div>

    <div class="float-panel" id="controls3DPanel" style="display:none">
      <h4><span>Điều khiển 3D & Nắp</span> <button class="secondary sm" id="toggleOverlay" style="padding:2px 7px;font-size:11px">Thu gọn</button></h4>
      <div id="overlayContent">
        <div class="field"><label>Mở nắp trên lớn (L)</label><input id="topMainOpen" type="range" min="0" max="135" value="32"></div>
        <div class="field"><label>Mở nắp trên nhỏ (W)</label><input id="topSideOpen" type="range" min="0" max="115" value="12"></div>
        <div class="field"><label>Mở cánh đáy</label><input id="bottomOpen" type="range" min="0" max="110" value="0"></div>
        <div class="actions" style="margin-top:8px">
          <button class="secondary sm" id="presetStudio" style="flex:1">Mở tự nhiên</button>
          <button class="secondary sm" id="presetClosed" style="flex:1">Đóng kín</button>
        </div>
      </div>
    </div>
  </div>
</section>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let currentMode = '2d';
let loadedArtImg = null;

let zoom2D = 1.0;
let pan2D = { x: 0, y: 0 };
let artRect = { x: 0, y: 0, w: 300, h: 200 };
let activeHandle = null;
let dragStart2D = { x: 0, y: 0 };

const viewArea = document.getElementById('viewArea');
const canvas2D = document.getElementById('dieline2DCanvas');
const ctx2D = canvas2D.getContext('2d');

function getDims() {
  return {
    L: Math.max(30, +document.getElementById('L').value || 545),
    W: Math.max(30, +document.getElementById('W').value || 305),
    H: Math.max(30, +document.getElementById('H').value || 410),
    T: Math.max(1, +document.getElementById('thick').value || 5),
    TS: Math.max(0, +document.getElementById('glueTS').value || 35),
    topFlapH: Math.max(0, +document.getElementById('topFlapH').value || 155.5),
    botFlapH: Math.max(0, +document.getElementById('botFlapH').value || 155.5),
    slotGap: Math.max(0, +document.getElementById('slotGap').value || 6),
    fluteLayers: parseInt(document.getElementById('fluteLayers').value || 5),
    tapeWidthMm: Math.max(10, +document.getElementById('tapeWidthMm').value || 60),
    tapeOverlapMm: Math.max(0, +document.getElementById('tapeOverlapMm').value || 60)
  };
}

function getDielineGeometry(d) {
  const totalW = d.TS + d.L + d.W + d.L + d.W;
  const totalH = d.topFlapH + d.H + d.botFlapH;
  return { totalW, totalH };
}

function getLayoutMetrics(d) {
  const cw = canvas2D.width, ch = canvas2D.height;
  const geom = getDielineGeometry(d);
  const padding = 60;
  const scale = Math.min((cw - padding * 2) / geom.totalW, (ch - padding * 2) / geom.totalH);
  const startX = (cw - geom.totalW * scale) / 2;
  const startY = (ch - geom.totalH * scale) / 2;
  return { scale, startX, startY };
}

function getArtRectPx() {
  const scale = getLayoutMetrics(getDims()).scale;
  return { x: artRect.x * scale, y: artRect.y * scale, w: artRect.w * scale, h: artRect.h * scale, scale };
}

function resizeCanvas2D() {
  if (!viewArea) return;
  canvas2D.width = viewArea.clientWidth || 900;
  canvas2D.height = viewArea.clientHeight || 600;
  render2DDieline();
}

function render2DDieline() {
  if (currentMode !== '2d') return;
  const d = getDims();
  const cw = canvas2D.width, ch = canvas2D.height;

  ctx2D.clearRect(0, 0, cw, ch);

  const geom = getDielineGeometry(d);
  const metrics = getLayoutMetrics(d);
  const { scale, startX, startY } = metrics;
  const paperColor = document.getElementById('paperColorPicker').value;

  ctx2D.save();
  ctx2D.translate(cw / 2 + pan2D.x, ch / 2 + pan2D.y);
  ctx2D.scale(zoom2D, zoom2D);
  ctx2D.translate(-cw / 2, -ch / 2);

  ctx2D.save();
  ctx2D.translate(startX, startY);

  ctx2D.fillStyle = paperColor;
  ctx2D.fillRect(0, 0, geom.totalW * scale, geom.totalH * scale);

  if (loadedArtImg) {
    const rpx = getArtRectPx();
    ctx2D.drawImage(loadedArtImg, rpx.x, rpx.y, rpx.w, rpx.h);

    ctx2D.strokeStyle = '#10b981';
    ctx2D.lineWidth = 1.5;
    ctx2D.strokeRect(rpx.x, rpx.y, rpx.w, rpx.h);

    const handles = getHandles();
    ctx2D.fillStyle = '#10b981';
    Object.values(handles).forEach(h => {
      ctx2D.fillRect(h.x - 5, h.y - 5, 10, 10);
    });
  }

  ctx2D.strokeStyle = '#ec4899';
  ctx2D.lineWidth = 1.5;

  const topH_px = d.topFlapH * scale;
  const h_px = d.H * scale;
  const botH_px = d.botFlapH * scale;
  const totalH_px = topH_px + h_px + botH_px;
  const totalW_px = geom.totalW * scale;

  ctx2D.beginPath();
  ctx2D.moveTo(0, topH_px); ctx2D.lineTo(totalW_px, topH_px);
  ctx2D.moveTo(0, topH_px + h_px); ctx2D.lineTo(totalW_px, topH_px + h_px);
  ctx2D.stroke();

  let curX = d.TS * scale;
  const panelWidths = [d.L, d.W, d.L, d.W];

  ctx2D.strokeRect(0, 0, d.TS * scale, totalH_px);
  ctx2D.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx2D.font = 'bold 11px sans-serif';
  ctx2D.fillText(`TS (${d.TS}mm)`, 4, topH_px + h_px / 2);

  panelWidths.forEach((pw, idx) => {
    const nextX = curX + pw * scale;
    if (idx > 0) {
      ctx2D.beginPath();
      ctx2D.moveTo(curX, 0); ctx2D.lineTo(curX, totalH_px);
      ctx2D.stroke();
    }

    ctx2D.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx2D.font = 'bold 12px sans-serif';
    const panelName = idx % 2 === 0 ? `L${idx/2+1} (${pw}mm)` : `W${(idx+1)/2} (${pw}mm)`;
    ctx2D.fillText(panelName, curX + 10, topH_px + 22);

    ctx2D.font = '10px sans-serif';
    ctx2D.fillStyle = '#b45309';
    if (d.topFlapH > 0) ctx2D.fillText(`Cánh trên: ${d.topFlapH}mm`, curX + 10, topH_px - 8);
    ctx2D.fillText(`Cao H: ${d.H}mm`, curX + 10, topH_px + h_px / 2);
    if (d.botFlapH > 0) ctx2D.fillText(`Cánh đáy: ${d.botFlapH}mm`, curX + 10, topH_px + h_px + 16);

    if (d.slotGap > 0) {
      ctx2D.fillStyle = '#0f172a';
      const gapPx = d.slotGap * scale;
      ctx2D.fillRect(curX - gapPx / 2, topH_px - 2, gapPx, 4);
      ctx2D.fillRect(curX - gapPx / 2, topH_px + h_px - 2, gapPx, 4);
    }

    curX = nextX;
  });

  ctx2D.strokeStyle = '#0f172a';
  ctx2D.lineWidth = 2;
  ctx2D.strokeRect(0, 0, totalW_px, totalH_px);

  ctx2D.restore();
  ctx2D.restore();
}

function getHandles() {
  const r = getArtRectPx();
  return {
    tl: { x: r.x, y: r.y },
    tr: { x: r.x + r.w, y: r.y },
    bl: { x: r.x, y: r.y + r.h },
    br: { x: r.x + r.w, y: r.y + r.h },
    t: { x: r.x + r.w / 2, y: r.y },
    b: { x: r.x + r.w / 2, y: r.y + r.h },
    l: { x: r.x, y: r.y + r.h / 2 },
    r: { x: r.x + r.w, y: r.y + r.h / 2 }
  };
}

function getCanvasWorldPos(e) {
  const rect = canvas2D.getBoundingClientRect();
  const cw = canvas2D.width, ch = canvas2D.height;
  const metrics = getLayoutMetrics(getDims());

  const clientX = e.clientX - rect.left;
  const clientY = e.clientY - rect.top;

  const xAfterPan = clientX - (cw / 2 + pan2D.x);
  const yAfterPan = clientY - (ch / 2 + pan2D.y);
  const xUnscaled = xAfterPan / zoom2D;
  const yUnscaled = yAfterPan / zoom2D;
  const xFinal = xUnscaled + cw / 2 - metrics.startX;
  const yFinal = yUnscaled + ch / 2 - metrics.startY;

  return { x: xFinal, y: yFinal };
}

canvas2D.addEventListener('pointerdown', e => {
  if (currentMode !== '2d') return;
  const m = getCanvasWorldPos(e);

  if (loadedArtImg) {
    const handles = getHandles();
    for (let [key, pos] of Object.entries(handles)) {
      if (Math.hypot(m.x - pos.x, m.y - pos.y) < 12 / zoom2D) {
        activeHandle = key;
        dragStart2D = { x: m.x, y: m.y, scale: getArtRectPx().scale, rect: { ...artRect } };
        canvas2D.setPointerCapture(e.pointerId);
        return;
      }
    }

    const rpx = getArtRectPx();
    if (m.x >= rpx.x && m.x <= rpx.x + rpx.w && m.y >= rpx.y && m.y <= rpx.y + rpx.h) {
      activeHandle = 'move';
      dragStart2D = { x: m.x, y: m.y, scale: rpx.scale, rect: { ...artRect } };
      canvas2D.setPointerCapture(e.pointerId);
      return;
    }
  }

  activeHandle = 'pan';
  dragStart2D = { x: e.clientX, y: e.clientY, panX: pan2D.x, panY: pan2D.y };
  canvas2D.setPointerCapture(e.pointerId);
});

canvas2D.addEventListener('pointermove', e => {
  if (currentMode !== '2d' || !activeHandle) return;

  if (activeHandle === 'pan') {
    pan2D.x = dragStart2D.panX + (e.clientX - dragStart2D.x);
    pan2D.y = dragStart2D.panY + (e.clientY - dragStart2D.y);
    render2DDieline();
    return;
  }

  if (!loadedArtImg) return;
  const m = getCanvasWorldPos(e);
  const dx = (m.x - dragStart2D.x) / dragStart2D.scale;
  const dy = (m.y - dragStart2D.y) / dragStart2D.scale;
  const r = dragStart2D.rect;
  const aspect = r.w / r.h;

  if (activeHandle === 'move') {
    artRect.x = r.x + dx; artRect.y = r.y + dy;
  } else if (e.shiftKey && ['tl', 'tr', 'bl', 'br'].includes(activeHandle)) {
    // Co giãn đều giữ nguyên tỷ lệ (giống phím Shift trong Adobe Illustrator)
    if (activeHandle === 'br') {
      const newW = Math.max(5, r.w + dx);
      const newH = newW / aspect;
      artRect.w = newW; artRect.h = newH;
    } else if (activeHandle === 'tl') {
      const newW = Math.max(5, r.w - dx);
      const newH = newW / aspect;
      artRect.x = r.x + (r.w - newW);
      artRect.y = r.y + (r.h - newH);
      artRect.w = newW; artRect.h = newH;
    } else if (activeHandle === 'tr') {
      const newW = Math.max(5, r.w + dx);
      const newH = newW / aspect;
      artRect.y = r.y + (r.h - newH);
      artRect.w = newW; artRect.h = newH;
    } else if (activeHandle === 'bl') {
      const newW = Math.max(5, r.w - dx);
      const newH = newW / aspect;
      artRect.x = r.x + (r.w - newW);
      artRect.w = newW; artRect.h = newH;
    }
  } else {
    // Co giãn tự do 4 cạnh / 4 góc
    if (activeHandle === 'tl') {
      artRect.x = r.x + dx; artRect.w = r.w - dx; artRect.y = r.y + dy; artRect.h = r.h - dy;
    } else if (activeHandle === 'tr') {
      artRect.w = r.w + dx; artRect.y = r.y + dy; artRect.h = r.h - dy;
    } else if (activeHandle === 'bl') {
      artRect.x = r.x + dx; artRect.w = r.w - dx; artRect.h = r.h + dy;
    } else if (activeHandle === 'br') {
      artRect.w = r.w + dx; artRect.h = r.h + dy;
    } else if (activeHandle === 't') {
      artRect.y = r.y + dy; artRect.h = r.h - dy;
    } else if (activeHandle === 'b') {
      artRect.h = r.h + dy;
    } else if (activeHandle === 'l') {
      artRect.x = r.x + dx; artRect.w = r.w - dx;
    } else if (activeHandle === 'r') {
      artRect.w = r.w + dx;
    }
  }
  artRect.w = Math.max(5, artRect.w);
  artRect.h = Math.max(5, artRect.h);
  render2DDieline();
});

canvas2D.addEventListener('pointerup', () => { activeHandle = null; });

canvas2D.addEventListener('wheel', e => {
  if (currentMode !== '2d') return;
  e.preventDefault();

  const rect = canvas2D.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const factor = e.deltaY < 0 ? 1.15 : 0.85;
  const newZoom = Math.max(0.2, Math.min(10, zoom2D * factor));

  const cw = canvas2D.width, ch = canvas2D.height;
  const worldX = (mouseX - (cw / 2 + pan2D.x)) / zoom2D;
  const worldY = (mouseY - (ch / 2 + pan2D.y)) / zoom2D;

  zoom2D = newZoom;
  pan2D.x = mouseX - (cw / 2 + worldX * zoom2D);
  pan2D.y = mouseY - (ch / 2 + worldY * zoom2D);

  render2DDieline();
}, { passive: false });

function createPaperTexture(hexColor) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hexColor; ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(70,40,15,0.14)' : 'rgba(255,245,220,0.18)';
    ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2, 2);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createCorrugatedEdgeTexture(hexColor, layers = 5) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hexColor; ctx.fillRect(0, 0, 128, 128);

  const h = 128;
  if (layers === 3) {
    ctx.fillStyle = '#b08a5e'; ctx.fillRect(0, 0, 128, 18);
    ctx.fillRect(0, 110, 128, 18);
    ctx.fillStyle = '#9e7b51'; ctx.fillRect(0, 18, 128, 92);
    ctx.strokeStyle = '#573c20'; ctx.lineWidth = 3.5;
    ctx.beginPath();
    for (let x = 0; x <= 128; x += 2) {
      const y = 64 + Math.sin((x / 128) * Math.PI * 10) * 22;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  } else if (layers === 7) {
    const stripH = h / 7;
    for (let i = 0; i < 7; i++) {
      if (i % 2 === 0) {
        ctx.fillStyle = '#b08a5e'; ctx.fillRect(0, i * stripH, 128, stripH);
      } else {
        ctx.fillStyle = '#9e7b51'; ctx.fillRect(0, i * stripH, 128, stripH);
        ctx.strokeStyle = '#573c20'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let x = 0; x <= 128; x += 2) {
          const y = (i + 0.5) * stripH + Math.sin((x / 128) * Math.PI * 12) * 6;
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
  } else {
    const stripH = h / 5;
    for (let i = 0; i < 5; i++) {
      if (i % 2 === 0) {
        ctx.fillStyle = '#b08a5e'; ctx.fillRect(0, i * stripH, 128, stripH + 2);
      } else {
        ctx.fillStyle = '#9e7b51'; ctx.fillRect(0, i * stripH, 128, stripH);
        ctx.strokeStyle = '#573c20'; ctx.lineWidth = 3;
        ctx.beginPath();
        for (let x = 0; x <= 128; x += 2) {
          const y = (i + 0.5) * stripH + Math.sin((x / 128) * Math.PI * 10) * 10;
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(16, 1);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

let cartonRoot = new THREE.Group();
scene.add(cartonRoot);
let flapControllers = [];
let topTapeGroup = null, botTapeGroup = null;

function createPanelMaterial3D(panelIdx, regionType, d) {
  const texCanvas = document.createElement('canvas');
  texCanvas.width = 1024; texCanvas.height = 1024;
  const ctx = texCanvas.getContext('2d');

  const paperColor = document.getElementById('paperColorPicker').value;
  ctx.fillStyle = paperColor;
  ctx.fillRect(0, 0, 1024, 1024);

  if (loadedArtImg) {
    let panelX = d.TS;
    if (panelIdx === 1) panelX = d.TS + d.L;
    else if (panelIdx === 2) panelX = d.TS + d.L + d.W;
    else if (panelIdx === 3) panelX = d.TS + d.L + d.W + d.L;
    const pw = (panelIdx % 2 === 0) ? d.L : d.W;

    let regionY = d.topFlapH, rh = d.H;
    if (regionType === 'top') { regionY = 0; rh = d.topFlapH; }
    else if (regionType === 'bottom') { regionY = d.topFlapH + d.H; rh = d.botFlapH; }

    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    const pxPerMmX = loadedArtImg.width / artRect.w;
    const pxPerMmY = loadedArtImg.height / artRect.h;
    ctx.drawImage(loadedArtImg,
      (panelX - artRect.x) * pxPerMmX,
      (regionY - artRect.y) * pxPerMmY,
      pw * pxPerMmX,
      rh * pxPerMmY,
      0, 0, 1024, 1024
    );
    ctx.restore();
  }

  const tex = new THREE.CanvasTexture(texCanvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.86 });
}

function buildCarton3D() {
  cartonRoot.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const arr = Array.isArray(obj.material) ? obj.material : [obj.material];
      arr.forEach(m => m.dispose());
    }
  });
  scene.remove(cartonRoot);
  cartonRoot = new THREE.Group();
  scene.add(cartonRoot);
  flapControllers = [];

  const d = getDims();
  const { L, W, H, T, TS, topFlapH, botFlapH, slotGap, fluteLayers, tapeWidthMm, tapeOverlapMm } = d;
  const paperColor = document.getElementById('paperColorPicker').value;

  const innerMat = new THREE.MeshStandardMaterial({ map: createPaperTexture(paperColor), roughness: 0.92 });
  const edgeMat = new THREE.MeshStandardMaterial({ map: createCorrugatedEdgeTexture(paperColor, fluteLayers), roughness: 0.95 });

  const wallConfigs = [
    { panelIdx: 0, w: L, pos: [0, H / 2, W / 2 - T / 2], rotY: 0, isLong: true },
    { panelIdx: 1, w: W - T * 2, pos: [L / 2 - T / 2, H / 2, 0], rotY: Math.PI / 2, isLong: false },
    { panelIdx: 2, w: L, pos: [0, H / 2, -W / 2 + T / 2], rotY: Math.PI, isLong: true },
    { panelIdx: 3, w: W - T * 2, pos: [-L / 2 + T / 2, H / 2, 0], rotY: -Math.PI / 2, isLong: false }
  ];

  wallConfigs.forEach(cfg => {
    const wallGroup = new THREE.Group();
    wallGroup.position.set(...cfg.pos);
    wallGroup.rotation.y = cfg.rotY;
    cartonRoot.add(wallGroup);

    const bodyMat = createPanelMaterial3D(cfg.panelIdx, 'body', d);
    const bodyBox = new THREE.Mesh(new THREE.BoxGeometry(cfg.w, H, T), [edgeMat, edgeMat, edgeMat, edgeMat, bodyMat, innerMat]);
    bodyBox.castShadow = true; bodyBox.receiveShadow = true;
    wallGroup.add(bodyBox);

    if (topFlapH > 0) {
      const hinge = new THREE.Group(); hinge.position.set(0, H / 2, T / 2); wallGroup.add(hinge);
      const flapMat = createPanelMaterial3D(cfg.panelIdx, 'top', d);
      const flapBox = new THREE.Mesh(new THREE.BoxGeometry(cfg.w - slotGap, topFlapH, T), [edgeMat, edgeMat, edgeMat, edgeMat, flapMat, innerMat]);
      flapBox.position.set(0, topFlapH / 2, -T / 2);
      flapBox.castShadow = true; flapBox.receiveShadow = true;
      hinge.add(flapBox);
      flapControllers.push({ hinge, isTop: true, isLong: cfg.isLong });
    }

    if (botFlapH > 0) {
      const hinge = new THREE.Group(); hinge.position.set(0, -H / 2, T / 2); wallGroup.add(hinge);
      const flapMat = createPanelMaterial3D(cfg.panelIdx, 'bottom', d);
      const flapBox = new THREE.Mesh(new THREE.BoxGeometry(cfg.w - slotGap, botFlapH, T), [edgeMat, edgeMat, edgeMat, edgeMat, flapMat, innerMat]);
      flapBox.position.set(0, -botFlapH / 2, -T / 2);
      flapBox.castShadow = true; flapBox.receiveShadow = true;
      hinge.add(flapBox);
      flapControllers.push({ hinge, isTop: false, isLong: cfg.isLong });
    }
  });

  if (TS > 0 && H > 6) {
    const glueTab = new THREE.Mesh(new THREE.BoxGeometry(TS, H - 6, T * 0.8), innerMat);
    glueTab.position.set(-L / 2 + TS / 2 + T, H / 2, W / 2 - T * 1.4);
    cartonRoot.add(glueTab);
  }

  // Băng keo niêm phong nằm trên bề mặt ngoài cùng của 2 cánh chính (L) khi đóng lại (cao độ H + 2*T)
  // và gập 2 đầu tràn xuống mặt hông (W) một đoạn tapeOverlapMm
  const createFoldedTapeGroup = (isTop) => {
    const group = new THREE.Group();
    const isClear = document.getElementById('tapeMode').value === 'clear';
    const tapeColor = document.getElementById('tapeColorPicker').value || '#facc15';
    const tapeMat = new THREE.MeshPhysicalMaterial({
      color: isClear ? 0xfff8e7 : tapeColor,
      transparent: true, opacity: isClear ? 0.35 : 0.92, roughness: 0.18, side: THREE.DoubleSide
    });

    const eps = 0.6;
    // Khi đóng nắp (openDeg = 0), cánh chính L nằm ở độ cao H + T (tâm) và mặt ngoài ở H + 2*T
    const outerSurfaceY = isTop ? (H + T * 2 + eps) : -(T * 2 + eps);

    // 1. Đường băng keo dài chạy dọc theo khe hở giữa 2 cánh chính L trên mặt nắp/đáy
    const mainGeo = new THREE.PlaneGeometry(L + eps * 2, tapeWidthMm);
    const mainMesh = new THREE.Mesh(mainGeo, tapeMat);
    mainMesh.rotation.x = isTop ? -Math.PI / 2 : Math.PI / 2;
    mainMesh.position.set(0, outerSurfaceY, 0);
    group.add(mainMesh);

    // 2. Hai đầu băng keo bẻ góc 90 độ gập ôm sát vào 2 mặt hông phụ (W)
    if (tapeOverlapMm > 0) {
      const wrapY = isTop ? (outerSurfaceY - tapeOverlapMm / 2) : (outerSurfaceY + tapeOverlapMm / 2);
      const sideGeo = new THREE.PlaneGeometry(tapeWidthMm, tapeOverlapMm);

      const leftMesh = new THREE.Mesh(sideGeo, tapeMat);
      leftMesh.rotation.y = Math.PI / 2;
      leftMesh.position.set(-(L / 2 + eps), wrapY, 0);
      group.add(leftMesh);

      const rightMesh = new THREE.Mesh(sideGeo, tapeMat);
      rightMesh.rotation.y = Math.PI / 2;
      rightMesh.position.set(L / 2 + eps, wrapY, 0);
      group.add(rightMesh);
    }

    cartonRoot.add(group);
    return group;
  };

  if (topFlapH > 0) topTapeGroup = createFoldedTapeGroup(true);
  if (botFlapH > 0) botTapeGroup = createFoldedTapeGroup(false);

  applyFlapAngles();
}

function applyFlapAngles() {
  const topMainDeg = +document.getElementById('topMainOpen').value;
  const topSideDeg = +document.getElementById('topSideOpen').value;
  const botDeg = +document.getElementById('bottomOpen').value;
  const T = getDims().T;

  flapControllers.forEach(fc => {
    let openDeg = fc.isTop ? (fc.isLong ? topMainDeg : topSideDeg) : botDeg;
    const sign = fc.isTop ? -1 : 1;
    fc.hinge.rotation.x = sign * (Math.PI / 2) - sign * THREE.MathUtils.degToRad(openDeg);
    fc.hinge.position.y = (fc.isTop ? 1 : -1) * (getDims().H / 2 + (openDeg < 5 ? (fc.isLong ? T : 0.2) : 0));
  });

  const mode = document.getElementById('tapeMode').value;
  const isClear = mode === 'clear';
  const tapeColor = document.getElementById('tapeColorPicker').value || '#facc15';

  if (topTapeGroup) topTapeGroup.visible = (mode !== 'none' && topMainDeg === 0 && topSideDeg === 0);
  if (botTapeGroup) botTapeGroup.visible = (mode !== 'none' && botDeg === 0);

  [topTapeGroup, botTapeGroup].forEach(group => {
    if (!group) return;
    group.children.forEach(mesh => {
      mesh.material.color.set(isClear ? 0xfff8e7 : tapeColor);
      mesh.material.opacity = isClear ? 0.35 : 0.92;
    });
  });
}

function focusCamera(preset = 'iso') {
  const { L, W, H } = getDims();
  const maxDim = Math.max(L, W, H);
  controls.target.set(0, H * 0.48, 0);
  if (preset === 'front') camera.position.set(0, H * 0.55, maxDim * 2.2);
  else if (preset === 'side') camera.position.set(maxDim * 2.2, H * 0.55, 0);
  else if (preset === 'top') camera.position.set(0, maxDim * 2.4, 10);
  else if (preset === 'bottom') camera.position.set(0, -maxDim * 2.4, 10);
  else camera.position.set(maxDim * 1.65, maxDim * 1.25, maxDim * 1.85);
  controls.update();
}

  document.getElementById(id).oninput = applyFlapAngles;
});

document.getElementById('tapeMode').onchange = e => {
  document.getElementById('tapeColorRow').style.display = e.target.value === 'color' ? 'grid' : 'none';
  applyFlapAngles();
};
document.getElementById('tapeColorPicker').oninput = applyFlapAngles;

document.getElementById('presetStudio').onclick = () => {
  document.getElementById('topMainOpen').value = 32;
  document.getElementById('topSideOpen').value = 12;
  document.getElementById('bottomOpen').value = 0;
  applyFlapAngles();
};
document.getElementById('presetClosed').onclick = () => {
  document.getElementById('topMainOpen').value = 0;
  document.getElementById('topSideOpen').value = 0;
  document.getElementById('bottomOpen').value = 0;
  applyFlapAngles();
};

document.getElementById('camIso').onclick = () => focusCamera('iso');
document.getElementById('camFront').onclick = () => focusCamera('front');
document.getElementById('camSide').onclick = () => focusCamera('side');
document.getElementById('camTop').onclick = () => focusCamera('top');
document.getElementById('camBottom').onclick = () => focusCamera('bottom');

document.getElementById('saveBtn').onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = `carton-mockup-${getDims().L}x${getDims().W}x${getDims().H}.png`;
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
};

document.getElementById('toggleOverlay').onclick = () => {
  const c = document.getElementById('overlayContent');
  const b = document.getElementById('toggleOverlay');
  c.style.display = c.style.display === 'none' ? 'block' : 'none';
  b.textContent = c.style.display === 'none' ? 'Mở rộng' : 'Thu gọn';
};

new ResizeObserver(() => {
  if (currentMode === '3d') {
    const w = viewArea.clientWidth, h = viewArea.clientHeight;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  } else {
    resizeCanvas2D();
  }
}).observe(viewArea);

function animate() {
  requestAnimationFrame(animate);
  if (currentMode === '3d') {
    controls.update();
    renderer.render(scene, camera);
  }
}

window.addEventListener('load', () => {
  resizeCanvas2D();
});
resizeCanvas2D();
animate();
</script>
</body>
</html>
