<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTO MOCKUP 3D STUDIO - V2.0 ULTIMATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&family=Montserrat:wght@600;700;800;900&family=Roboto+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1120;--panel:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --primary:#0284c7;--primary-hover:#0369a1;--accent:#f97316;--accent-hover:#ea580c;
  --danger:#ef4444;--danger-hover:#dc2626;--success:#10b981;
}
*{box-sizing:border-box}
body{
  margin:0;background:#f1f5f9;color:var(--ink);
  font:13px/1.4 'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
}

header{
  background:linear-gradient(125deg, #090d16 0%, #172554 55%, #0c4a6e 100%);
  color:#fff;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:2px solid #0284c7;box-shadow:0 3px 12px rgba(2,132,199,0.25);flex-shrink:0;
}

.header-clock{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  color:#ffffff;min-width:190px;padding:3px 10px;border-radius:8px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
}
.clock-time{
  font-size:17px;font-weight:800;letter-spacing:1.2px;color:#ffffff;
  font-variant-numeric:tabular-nums;line-height:1.15;
}
.clock-date{
  font-size:11px;font-weight:600;color:#ffffff;opacity:0.92;margin-top:2px;letter-spacing:.2px;
}

.brand-center{
  flex:1;display:flex;align-items:center;justify-content:space-evenly;gap:18px;
  padding:0 12px;
}
.brand-logo-wrap{display:flex;align-items:center;gap:10px;}
.brand-logo{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg, #38bdf8, #0284c7);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(56,189,248,0.45);flex-shrink:0;
}
.brand-title{
  display:flex;align-items:center;gap:9px;margin:0;
  font-size:18px;font-weight:900;letter-spacing:.6px;color:#f8fafc;white-space:nowrap;
}
.ver-pill{
  background:rgba(16,185,129,0.22);border:1px solid #10b981;color:#34d399;
  border-radius:20px;padding:2px 9px;font-size:10.5px;font-weight:800;
}
.brand-divider{width:1.5px;height:24px;background:rgba(255,255,255,0.2);border-radius:2px;}
.brand-sub{
  color:#e2e8f0;font-size:13px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;white-space:nowrap;
  background:rgba(2,132,199,0.22);border:1px solid rgba(56,189,248,0.3);
  padding:5px 14px;border-radius:20px;
}

.author-credit{
  font-size:10.5px;color:#e2e8f0;letter-spacing:.3px;text-align:right;font-weight:600;
  background:rgba(255,255,255,0.07);padding:6px 11px;border-radius:8px;
  border:1px solid rgba(255,255,255,0.14);white-space:nowrap;
}

main{
  flex:1;min-height:0;width:100%;max-width:1920px;margin:auto;padding:8px 10px;
  display:grid;grid-template-columns:375px minmax(0,1fr);gap:10px;
}
.panel,.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(15,23,42,0.05)}
.panel{padding:11px 13px;height:100%;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-start;gap:10px}
.panel h2{
  font-size:12.5px;margin:0 0 7px;color:#0f172a;display:flex;align-items:center;justify-content:space-between;gap:6px;
  font-weight:800;border-bottom:1.5px solid #e0f2fe;padding-bottom:4px;text-transform:uppercase;letter-spacing:.3px;
}
.section{padding-bottom:10px;margin-bottom:0;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0;padding-bottom:0}

.field{display:grid;grid-template-columns:1fr 115px;align-items:center;gap:6px;margin:5px 0}
.field label{color:#334155;font-size:12px;font-weight:600}
.field input[type=number],.field select{
  width:100%;padding:4px 7px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;
  color:var(--ink);font-size:12px;font-weight:600;font-family:inherit;transition:.15s;
}
.field input[type=number]:focus,.field select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px rgba(2,132,199,0.15)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini-field{display:flex;flex-direction:column;gap:2px}
.mini-field label{font-size:11px;color:var(--muted);font-weight:600}
.mini-field input{
  width:100%;padding:4px 7px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;
  font-size:12px;font-weight:600;font-family:inherit;transition:.15s;
}
.mini-field input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px rgba(2,132,199,0.15)}

.file-row{display:flex;gap:6px;align-items:center}
input[type=file]{
  flex:1;font-size:11.5px;padding:5px 7px;border:1.5px dashed #0284c7;border-radius:7px;
  background:#f0f9ff;cursor:pointer;color:#0369a1;font-weight:600;font-family:inherit;transition:.15s;
}
input[type=file]:hover{background:#e0f2fe}

button{
  border:0;border-radius:7px;background:var(--primary);color:#fff;padding:7px 12px;
  font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:all .15s ease;
  box-shadow:0 2px 5px rgba(2,132,199,0.25);display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
button:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 4px 9px rgba(2,132,199,0.35)}
button:active{transform:scale(0.97) translateY(0)}
button:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}

button.secondary{background:#e2e8f0;color:#1e293b;box-shadow:none}
button.secondary:hover{background:#cbd5e1;transform:translateY(-1px)}
button.secondary:active{transform:scale(0.97)}

button.danger{background:var(--danger);color:#fff;box-shadow:0 2px 5px rgba(239,68,68,0.25);padding:6px 10px}
button.danger:hover{background:var(--danger-hover)}

button.eraser-btn{background:#fce7f3;color:#be185d;border:1.5px solid #f472b6;box-shadow:none}
button.eraser-btn:hover{background:#fbcfe8;border-color:#ec4899}
button.eraser-btn.active{
  background:linear-gradient(135deg, #ec4899 0%, #db2777 100%);
  color:#ffffff;border-color:#f9a8d4;box-shadow:0 3px 10px rgba(219,39,119,0.4);
}
.eraser-controls{
  display:none;align-items:center;gap:6px;
  background:#fdf2f8;border:1px solid #f9a8d4;border-radius:7px;
  padding:3px 9px;font-size:11.5px;font-weight:700;color:#9d174d;
}
.eraser-controls.visible{display:inline-flex}
.eraser-controls input[type=range]{width:80px;accent-color:#db2777;cursor:pointer}

button.text-tool-btn{background:#eff6ff;color:#1d4ed8;border:1.5px solid #93c5fd;box-shadow:none}
button.text-tool-btn:hover{background:#dbeafe;border-color:#3b82f6}
button.text-tool-btn.active{
  background:linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  color:#ffffff;border-color:#60a5fa;box-shadow:0 3px 10px rgba(59,130,246,0.4);
}

button.toggle-info-btn{
  width:100%;background:linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
  color:#fff;padding:7px 12px;font-size:12px;font-weight:700;letter-spacing:.2px;
  box-shadow:0 3px 10px rgba(79,70,229,0.3);border:1px solid #818cf8;
}
button.toggle-info-btn:hover{background:linear-gradient(135deg, #4f46e5 0%, #4338ca 100%)}
button.toggle-info-btn.hidden-state{
  background:linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  border-color:#fbbf24;box-shadow:0 3px 10px rgba(217,119,6,0.32);
}

button.cta-3d{
  width:100%;background:linear-gradient(135deg, #f97316 0%, #ea580c 100%);
  color:#fff;padding:10px 14px;font-size:14px;font-weight:800;letter-spacing:.3px;
  box-shadow:0 4px 12px rgba(234,88,12,0.38);border:1px solid #fb923c;
}
button.cta-3d:hover{background:linear-gradient(135deg, #ea580c 0%, #c2410c 100%)}

button.cta-2d{
  width:100%;background:linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
  color:#fff;padding:9px 14px;font-size:13.5px;font-weight:800;letter-spacing:.3px;
  box-shadow:0 4px 12px rgba(13,148,136,0.35);border:1px solid #2dd4bf;
}
button.cta-2d:hover{background:linear-gradient(135deg, #0f766e 0%, #115e59 100%)}

button.sm{padding:5px 9px;font-size:11.5px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}

.stage{height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;position:relative}
.toolbar{padding:7px 12px;border-bottom:1px solid var(--line);display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:#f8fafc;z-index:2;flex-shrink:0;min-height:40px}
.toolbar-group{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

#viewArea{flex:1;min-height:0;position:relative;background:#0f172a;overflow:hidden;display:flex;align-items:center;justify-content:center}
#dieline2DCanvas{background:#1e293b;cursor:crosshair;box-shadow:0 10px 28px rgba(0,0,0,0.65)}
#threeCanvas{display:none;width:100%;height:100%}

.float-panel{
  position:absolute;top:12px;left:12px;background:rgba(255,255,255,0.96);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:300px;z-index:10;
  box-shadow:0 8px 24px rgba(15,23,42,0.2);font-size:12px;
}
.float-panel h4{margin:0 0 7px 0;font-size:12.5px;color:var(--primary);display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid #e0f2fe;padding-bottom:4px;font-weight:800}
.float-panel .field{grid-template-columns:1fr 95px;margin:4px 0}

.anim-bar{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(15,23,42,0.92);backdrop-filter:blur(12px);
  border:1px solid rgba(56,189,248,0.35);border-radius:12px;
  padding:10px 18px;display:none;align-items:center;gap:12px;z-index:20;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);color:#fff;font-size:12px;min-width:520px;
}
.anim-bar.visible{display:flex}
.anim-bar button{background:#0284c7;color:#fff;padding:6px 12px;font-size:12px;white-space:nowrap}
.anim-bar button:hover{background:#0369a1}
.anim-bar input[type=range]{flex:1;accent-color:#38bdf8;cursor:pointer}
.anim-status{font-family:'Roboto Mono',monospace;font-size:11px;color:#38bdf8;min-width:155px;text-align:right;white-space:nowrap}

@media(max-width:1180px){
  header{flex-wrap:wrap;justify-content:center}
  .brand-center{flex:initial;flex-wrap:wrap;justify-content:center}
}
@media(max-width:1024px){
  body{height:auto;overflow:auto}
  main{grid-template-columns:1fr;height:auto}
  .panel{height:auto}
  .stage{height:560px}
}
</style>
</head>
<body>

<header>
  <div class="header-clock" aria-label="Đồng hồ thời gian thực">
    <div id="liveClockTime" class="clock-time">00:00:00</div>
    <div id="liveClockDate" class="clock-date">Đang tải ngày...</div>
  </div>

  <div class="brand-center">
    <div class="brand-logo-wrap">
      <div class="brand-logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </div>
      <h1 class="brand-title">AUTO MOCKUP 3D STUDIO <span class="ver-pill">V2.0 ULTIMATE</span></h1>
    </div>

    <div class="brand-divider" aria-hidden="true"></div>

    <span class="brand-sub">Công cụ dựng hình 2D/3D THÙNG CARTON</span>
  </div>

  <div class="author-credit">CÔNG CỤ ĐƯỢC PHÁT TRIỂN TỪ Ý TƯỞNG CỦA BÙI VĂN THANH</div>
</header>

<main>
<aside class="panel">
  <div class="section">
    <h2>1. Kích thước thùng & Kết cấu</h2>
    <div class="grid-2">
      <div class="mini-field"><label>Dài (L), mm</label><input id="L" type="number" min="30" value="545"></div>
      <div class="mini-field"><label>Rộng (W), mm</label><input id="W" type="number" min="30" value="305"></div>
      <div class="mini-field"><label>Cao thân (H), mm</label><input id="H" type="number" min="30" value="410"></div>
      <div class="mini-field"><label>Độ dày sóng, mm</label><input id="thick" type="number" min="1" max="25" step="0.5" value="5"></div>
    </div>
    <div class="grid-2" style="margin-top:5px">
      <div class="mini-field"><label>Cao cánh trên (mm)</label><input id="topFlapH" type="number" min="0" value="155.5"></div>
      <div class="mini-field"><label>Cao cánh đáy (mm)</label><input id="botFlapH" type="number" min="0" value="155.5"></div>
    </div>
    <div class="grid-2" style="margin-top:5px">
      <div class="mini-field"><label>Mối nối TS (mm)</label><input id="glueTS" type="number" min="0" value="35"></div>
      <div class="mini-field"><label>Khe xẻ rãnh (mm)</label><input id="slotGap" type="number" min="0" max="15" value="6"></div>
    </div>

    <div class="field" style="margin-top:5px">
      <label>Cấu trúc sóng giấy</label>
      <select id="fluteLayers">
        <option value="3">Carton 3 lớp (1 sóng)</option>
        <option value="5" selected>Carton 5 lớp (2 sóng)</option>
        <option value="7">Carton 7 lớp (3 sóng)</option>
      </select>
    </div>

    <div class="field" style="margin-top:5px">
      <label>Màu giấy carton</label>
      <div style="display:flex;gap:5px;align-items:center">
        <input type="color" id="paperColorPicker" value="#c6a276" style="width:32px;height:26px;border:1px solid #cbd5e1;border-radius:5px;cursor:pointer;padding:0">
        <select id="paperPreset" style="flex:1">
          <option value="#c6a276">Kraft Vàng Tự Nhiên</option>
          <option value="#d9b382">Kraft Sáng</option>
          <option value="#a78153">Kraft Đậm</option>
          <option value="#f1f3f5">Carton Trắng</option>
        </select>
      </div>
    </div>

    <div class="actions" style="margin-top:7px;flex-direction:column;gap:6px">
      <button id="updateDielineBtn" style="width:100%;font-weight:800;letter-spacing:.2px">DỰNG BẢN TRẢI PHẲNG 2D NGAY!</button>
      <button type="button" id="toggle2DLabelsBtn" class="toggle-info-btn" title="Bật/tắt chữ thông số trên bản trải phẳng 2D">
        <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
        <span id="toggle2DLabelsText">Ẩn thông số trên bản 2D</span>
      </button>
    </div>
  </div>

  <div class="section">
    <h2>2. Băng keo niêm phong</h2>
    <div class="grid-2">
      <div class="mini-field"><label>Bản rộng keo (mm)</label><input id="tapeWidthMm" type="number" min="20" max="100" value="60"></div>
      <div class="mini-field"><label>Gập tràn hông (mm)</label><input id="tapeOverlapMm" type="number" min="0" max="150" value="60"></div>
    </div>
    <div class="field" style="margin-top:5px"><label>Loại & Màu keo</label><select id="tapeMode"><option value="none">Không dán</option><option value="clear">Băng keo trong</option><option value="color">Băng keo màu tùy chỉnh</option></select></div>
    <div id="tapeColorRow" class="field" style="display:none"><label>Chọn màu keo</label><input type="color" id="tapeColorPicker" value="#facc15" style="width:100%;height:24px;border:0;cursor:pointer;padding:0"></div>
  </div>

  <div class="section">
    <h2>3. File thiết kế & Chèn chữ</h2>
    <div class="file-row">
      <input id="artInput" type="file" accept="image/png,image/jpeg,image/webp,application/pdf">
      <button type="button" class="danger sm" id="clearArtBtn" title="Xóa tệp thiết kế hiện tại">✕ Xóa</button>
    </div>
    
    <div class="actions" style="margin-top:8px; display:flex; flex-direction:column; gap:6px;">
      <button id="build3DBtn" class="cta-3d">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span>DỰNG MOCKUP 3D NGAY</span>
      </button>
      <button id="switchMode2D_bottom" class="cta-2d">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <line x1="15" y1="3" x2="15" y2="21"></line>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="3" y1="15" x2="21" y2="15"></line>
        </svg>
        <span>QUAY LẠI CHỈNH 2D</span>
      </button>
    </div>
  </div>
</aside>

<section class="stage">
  <div class="toolbar">
    <div id="toolbar2D" class="toolbar-group">
      <button type="button" class="secondary sm" id="undoBtn" title="Hoàn tác (Ctrl + Z)" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
        <span>Undo (Ctrl+Z)</span>
      </button>
      <button type="button" class="secondary sm" id="redoBtn" title="Làm lại (Ctrl + Shift + Z / Ctrl + Y)" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 7v6h-6"></path>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
        </svg>
        <span>Redo (Ctrl+Shift+Z)</span>
      </button>

      <button type="button" class="eraser-btn sm" id="eraserToggleBtn" title="Gôm tẩy xóa chi tiết (Phím tắt: E)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
          <path d="M22 21H7"></path>
          <path d="m5 11 9 9"></path>
        </svg>
        <span id="eraserToggleText">Gôm tẩy</span>
      </button>
      <div id="eraserControls" class="eraser-controls">
        <span>Cỡ:</span>
        <input type="range" id="eraserSizeInput" min="5" max="150" value="35">
        <span id="eraserSizeLabel">35mm</span>
      </div>

      <button type="button" class="text-tool-btn sm" id="textToolToggleBtn" title="Chèn chữ, ghi chú tùy chỉnh lên phôi 2D">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 7 4 4 20 4 20 7"></polyline>
          <line x1="9" y1="20" x2="15" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
        <span id="textToolToggleText">Thêm Chữ / Đóng Dấu</span>
      </button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function updateLiveClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
  const dayName = days[now.getDay()];
  const dd = String(now.getDate()).padStart(2, '0');
  const mo = String(now.getMonth() + 1).padStart(2, '0');
  const yyyy = now.getFullYear();

  const timeEl = document.getElementById('liveClockTime');
  const dateEl = document.getElementById('liveClockDate');
  if (timeEl) timeEl.textContent = `${hh}:${mm}:${ss}`;
  if (dateEl) dateEl.textContent = `${dayName}, ${dd}/${mo}/${yyyy}`;
}
updateLiveClock();
setInterval(updateLiveClock, 1000);

let currentMode = '2d';
let loadedArtImg = null;
let show2DLabels = true;

let zoom2D = 1.0;
let pan2D = { x: 0, y: 0 };
let artRect = { x: 0, y: 0, w: 300, h: 200 };
let activeHandle = null;
let dragStart2D = { x: 0, y: 0 };

let eraserMode = false;
let eraserSizeMm = 35;
let isErasing = false;
let lastErasePos = null;
let mouseWorldPos2D = null;
let textToolMode = false;

let customTextItems = [];

let historyStack = [];
let historyIndex = -1;
const MAX_HISTORY = 40;

function updateUndoRedoButtons() {
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  if (undoBtn) undoBtn.disabled = historyIndex <= 0;
  if (redoBtn) redoBtn.disabled = historyIndex >= historyStack.length - 1;
}

function getArtDataURL() {
  if (!loadedArtImg) return null;
  if (loadedArtImg instanceof HTMLCanvasElement) return loadedArtImg.toDataURL('image/png');
  return loadedArtImg.src || null;
}

function pushHistory() {
  const snapshot = {
    artRect: { ...artRect },
    hasImg: !!loadedArtImg,
    imgData: getArtDataURL(),
    texts: JSON.parse(JSON.stringify(customTextItems))
  };
  if (historyIndex >= 0) {
    const prev = historyStack[historyIndex];
    if (
      prev.hasImg === snapshot.hasImg &&
      prev.imgData === snapshot.imgData &&
      Math.abs(prev.artRect.x - snapshot.artRect.x) < 0.01 &&
      Math.abs(prev.artRect.y - snapshot.artRect.y) < 0.01 &&
      Math.abs(prev.artRect.w - snapshot.artRect.w) < 0.01 &&
      Math.abs(prev.artRect.h - snapshot.artRect.h) < 0.01 &&
      JSON.stringify(prev.texts) === JSON.stringify(snapshot.texts)
    ) return;
  }
  historyStack = historyStack.slice(0, historyIndex + 1);
  historyStack.push(snapshot);
  if (historyStack.length > MAX_HISTORY) historyStack.shift();
  historyIndex = historyStack.length - 1;
  updateUndoRedoButtons();
}

function applyHistorySnapshot(snap) {
  artRect = { ...snap.artRect };
  customTextItems = JSON.parse(JSON.stringify(snap.texts || []));
  if (!snap.hasImg || !snap.imgData) {
    loadedArtImg = null;
    document.getElementById('artInput').value = '';
    if (currentMode === '2d') render2DDieline(); else buildCarton3D();
  } else {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      loadedArtImg = c;
      if (currentMode === '2d') render2DDieline(); else buildCarton3D();
    };
    img.src = snap.imgData;
  }
  updateUndoRedoButtons();
}

function undoAction() {
  if (historyIndex > 0) {
    historyIndex--;
    applyHistorySnapshot(historyStack[historyIndex]);
  }
}
function redoAction() {
  if (historyIndex < historyStack.length - 1) {
    historyIndex++;
    applyHistorySnapshot(historyStack[historyIndex]);
  }
}

document.getElementById('undoBtn').onclick = undoAction;
document.getElementById('redoBtn').onclick = redoAction;

const eraserToggleBtn = document.getElementById('eraserToggleBtn');
const eraserToggleText = document.getElementById('eraserToggleText');
const eraserControls = document.getElementById('eraserControls');
const eraserSizeInput = document.getElementById('eraserSizeInput');
const eraserSizeLabel = document.getElementById('eraserSizeLabel');

const textToolToggleBtn = document.getElementById('textToolToggleBtn');
const textToolToggleText = document.getElementById('textToolToggleText');
const textControls = document.getElementById('textControls');

function setEraserMode(state) {
  eraserMode = state;
  if (eraserMode) {
    textToolMode = false;
    textControls.classList.remove('visible');
    textToolToggleBtn.classList.remove('active');
    eraserToggleBtn.classList.add('active');
    eraserToggleText.textContent = 'Đang gôm';
    eraserControls.classList.add('visible');
    canvas2D.style.cursor = 'none';
  } else {
    eraserToggleBtn.classList.remove('active');
    eraserToggleText.textContent = 'Gôm tẩy';
    eraserControls.classList.remove('visible');
    canvas2D.style.cursor = 'crosshair';
  }
  render2DDieline();
}

function setTextToolMode(state) {
  textToolMode = state;
  if (textToolMode) {
    setEraserMode(false);
    textToolToggleBtn.classList.add('active');
    textToolToggleText.textContent = 'Đang chèn chữ';
    textControls.classList.add('visible');
    canvas2D.style.cursor = 'crosshair';
  } else {
    textToolToggleBtn.classList.remove('active');
    textToolToggleText.textContent = 'Thêm Chữ / Đóng Dấu';
    textControls.classList.remove('visible');
    canvas2D.style.cursor = 'crosshair';
  }
  render2DDieline();
}

eraserToggleBtn.onclick = () => setEraserMode(!eraserMode);
textToolToggleBtn.onclick = () => setTextToolMode(!textToolMode);

eraserSizeInput.oninput = e => {
  eraserSizeMm = parseInt(e.target.value, 10) || 35;
  eraserSizeLabel.textContent = `${eraserSizeMm}mm`;
  render2DDieline();
};

document.getElementById('addTextBtn').onclick = () => {
  const textVal = document.getElementById('customTextInput').value.trim();
  if (!textVal) return;
  const color = document.getElementById('textColorPicker').value;
  const fontSize = parseInt(document.getElementById('textSizeSelect').value, 10) || 24;

  const geom = getDielineGeometry(getDims());
  customTextItems.push({
    text: textVal,
    x: geom.totalW / 2,
    y: geom.totalH / 2,
    fontSize: fontSize,
    color: color,
    scale: 1.0
  });

  pushHistory();
  render2DDieline();
  setTextToolMode(false);
};

window.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) redoAction(); else undoAction();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault(); redoAction();
  } else if (e.key.toLowerCase() === 'e' && currentMode === '2d') {
    e.preventDefault(); setEraserMode(!eraserMode);
  }
});

const viewArea = document.getElementById('viewArea');
const canvas2D = document.getElementById('dieline2DCanvas');
const ctx2D = canvas2D.getContext('2d');

function getRawNum(id, fallback) {
  const val = document.getElementById(id).value;
  if (val === '' || val === null || isNaN(+val)) return fallback;
  return +val;
}

function getDims() {
  return {
    L: Math.max(30, getRawNum('L', 545)),
    W: Math.max(30, getRawNum('W', 305)),
    H: Math.max(30, getRawNum('H', 410)),
    T: Math.max(1, getRawNum('thick', 5)),
    TS: Math.max(0, getRawNum('glueTS', 35)),
    topFlapH: Math.max(0, getRawNum('topFlapH', 155.5)),
    botFlapH: Math.max(0, getRawNum('botFlapH', 155.5)),
    slotGap: Math.max(0, getRawNum('slotGap', 6)),
    fluteLayers: parseInt(document.getElementById('fluteLayers').value || 5),
    tapeWidthMm: Math.max(10, getRawNum('tapeWidthMm', 60)),
    tapeOverlapMm: Math.max(0, getRawNum('tapeOverlapMm', 60))
  };
}

function getDielineGeometry(d) {
  const totalW = d.TS + d.L + d.W + d.L + d.W;
  const totalH = d.topFlapH + d.H + d.botFlapH;
  return { totalW, totalH };
}

function getLayoutMetrics(d) {
  const cw = canvas2D.width, ch = canvas2D.height;
  const geom = getDielineGeometry(d);
  const padding = 45;
  const scale = Math.min((cw - padding * 2) / geom.totalW, (ch - padding * 2) / geom.totalH);
  const startX = (cw - geom.totalW * scale) / 2;
  const startY = (ch - geom.totalH * scale) / 2;
  return { scale, startX, startY };
}

function getArtRectPx() {
  const scale = getLayoutMetrics(getDims()).scale;
  return { x: artRect.x * scale, y: artRect.y * scale, w: artRect.w * scale, h: artRect.h * scale, scale };
}

function resizeCanvas2D() {
  if (!viewArea) return;
  canvas2D.width = viewArea.clientWidth || 900;
  canvas2D.height = viewArea.clientHeight || 600;
  render2DDieline();
}

function eraseArtworkAt(worldPos) {
  if (!loadedArtImg) return;
  const scale = getLayoutMetrics(getDims()).scale;
  const rPxCanvas = (eraserSizeMm / 2) * scale;
  const rArtX = (rPxCanvas / (artRect.w * scale)) * loadedArtImg.width;
  const rArtY = (rPxCanvas / (artRect.h * scale)) * loadedArtImg.height;
  const rArt = Math.max(2, (rArtX + rArtY) / 2);

  const curX = ((worldPos.x - artRect.x * scale) / (artRect.w * scale)) * loadedArtImg.width;
  const curY = ((worldPos.y - artRect.y * scale) / (artRect.h * scale)) * loadedArtImg.height;

  const actx = loadedArtImg.getContext('2d');
  actx.save();
  actx.globalCompositeOperation = 'destination-out';
  actx.lineCap = 'round';
  actx.lineJoin = 'round';
  actx.lineWidth = rArt * 2;
  actx.beginPath();
  if (lastErasePos) {
    const prevX = ((lastErasePos.x - artRect.x * scale) / (artRect.w * scale)) * loadedArtImg.width;
    const prevY = ((lastErasePos.y - artRect.y * scale) / (artRect.h * scale)) * loadedArtImg.height;
    actx.moveTo(prevX, prevY);
    actx.lineTo(curX, curY);
    actx.stroke();
  } else {
    actx.arc(curX, curY, rArt, 0, Math.PI * 2);
    actx.fill();
  }
  actx.restore();
}

function render2DDieline() {
  if (currentMode !== '2d') return;
  const d = getDims();
  const cw = canvas2D.width, ch = canvas2D.height;

  ctx2D.clearRect(0, 0, cw, ch);

  const geom = getDielineGeometry(d);
  const metrics = getLayoutMetrics(d);
  const { scale, startX, startY } = metrics;
  const paperColor = document.getElementById('paperColorPicker').value;

  const ts_px = d.TS * scale;
  const topH_px = d.topFlapH * scale;
  const h_px = d.H * scale;
  const botH_px = d.botFlapH * scale;
  const totalH_px = topH_px + h_px + botH_px;
  const totalW_px = geom.totalW * scale;

  const tsBevelPx = ts_px > 0 ? Math.min(ts_px * 0.5, h_px * 0.15, 20 * scale) : 0;

  ctx2D.save();
  ctx2D.translate(cw / 2 + pan2D.x, ch / 2 + pan2D.y);
  ctx2D.scale(zoom2D, zoom2D);
  ctx2D.translate(-cw / 2, -ch / 2);

  ctx2D.save();
  ctx2D.translate(startX, startY);

  const buildDielineClipPath = () => {
    ctx2D.beginPath();
    if (d.TS > 0) {
      ctx2D.moveTo(0, topH_px + tsBevelPx);
      ctx2D.lineTo(ts_px, topH_px);
      if (d.topFlapH > 0) {
        ctx2D.lineTo(ts_px, 0);
        ctx2D.lineTo(totalW_px, 0);
      } else {
        ctx2D.lineTo(totalW_px, topH_px);
      }
      if (d.botFlapH > 0) {
        ctx2D.lineTo(totalW_px, totalH_px);
        ctx2D.lineTo(ts_px, totalH_px);
        ctx2D.lineTo(ts_px, topH_px + h_px);
      } else {
        ctx2D.lineTo(totalW_px, topH_px + h_px);
        ctx2D.lineTo(ts_px, topH_px + h_px);
      }
      ctx2D.lineTo(0, topH_px + h_px - tsBevelPx);
      ctx2D.closePath();
    } else {
      ctx2D.rect(0, 0, totalW_px, totalH_px);
    }
  };

  ctx2D.save();
  buildDielineClipPath();
  ctx2D.fillStyle = paperColor;
  ctx2D.fill();
  ctx2D.restore();

  if (loadedArtImg) {
    const rpx = getArtRectPx();
    ctx2D.drawImage(loadedArtImg, rpx.x, rpx.y, rpx.w, rpx.h);

    if (!eraserMode && !textToolMode) {
      ctx2D.strokeStyle = '#10b981';
      ctx2D.lineWidth = 1.5;
      ctx2D.strokeRect(rpx.x, rpx.y, rpx.w, rpx.h);

      const handles = getHandles();
      ctx2D.fillStyle = '#10b981';
      Object.values(handles).forEach(h => {
        ctx2D.fillRect(h.x - 5, h.y - 5, 10, 10);
      });
    } else {
      ctx2D.strokeStyle = 'rgba(236, 72, 153, 0.65)';
      ctx2D.setLineDash([4, 4]);
      ctx2D.lineWidth = 1.2;
      ctx2D.strokeRect(rpx.x, rpx.y, rpx.w, rpx.h);
      ctx2D.setLineDash([]);
    }
  }

  customTextItems.forEach((item) => {
    ctx2D.save();
    const pxX = item.x * scale;
    const pxY = item.y * scale;
    ctx2D.translate(pxX, pxY);
    const actualFontSize = item.fontSize * (item.scale || 1.0);
    ctx2D.font = `bold ${actualFontSize}px "Be Vietnam Pro", sans-serif`;
    ctx2D.fillStyle = item.color || '#0f172a';
    ctx2D.textBaseline = 'middle';
    ctx2D.textAlign = 'center';
    ctx2D.fillText(item.text, 0, 0);

    if (!eraserMode && !textToolMode) {
      const m = ctx2D.measureText(item.text);
      const tw = m.width + 12;
      const th = actualFontSize + 10;
      item._box = { x: pxX - tw / 2, y: pxY - th / 2, w: tw, h: th };

      ctx2D.strokeStyle = '#3b82f6';
      ctx2D.lineWidth = 1.2;
      ctx2D.strokeRect(-tw / 2, -th / 2, tw, th);
      ctx2D.fillStyle = '#2563eb';
      ctx2D.fillRect(tw / 2 - 4, th / 2 - 4, 8, 8);
    }
    ctx2D.restore();
  });

  ctx2D.strokeStyle = '#ec4899';
  ctx2D.lineWidth = 1.5;

  ctx2D.beginPath();
  if (d.topFlapH > 0) {
    ctx2D.moveTo(ts_px, topH_px);
    ctx2D.lineTo(totalW_px, topH_px);
  }
  if (d.botFlapH > 0) {
    ctx2D.moveTo(ts_px, topH_px + h_px);
    ctx2D.lineTo(totalW_px, topH_px + h_px);
  }
  if (d.TS > 0) {
    ctx2D.moveTo(ts_px, topH_px);
    ctx2D.lineTo(ts_px, topH_px + h_px);
  }
  ctx2D.stroke();

  if (d.TS > 0 && show2DLabels) {
    ctx2D.save();
    ctx2D.translate(ts_px / 2, topH_px + h_px / 2);
    ctx2D.rotate(-Math.PI / 2);
    ctx2D.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx2D.font = 'bold 11px "Be Vietnam Pro", sans-serif';
    ctx2D.textAlign = 'center';
    ctx2D.textBaseline = 'middle';
    ctx2D.fillText(`TS Vát (${d.TS}mm)`, 0, 0);
    ctx2D.restore();
  }

  let curX = ts_px;
  const panelWidths = [d.L, d.W, d.L, d.W];

  panelWidths.forEach((pw, idx) => {
    const nextX = curX + pw * scale;
    if (idx > 0) {
      ctx2D.strokeStyle = '#ec4899';
      ctx2D.lineWidth = 1.5;
      ctx2D.beginPath();
      ctx2D.moveTo(curX, topH_px);
      ctx2D.lineTo(curX, topH_px + h_px);
      ctx2D.stroke();

      const gapPx = Math.max(1.5, d.slotGap * scale);
      ctx2D.fillStyle = '#1e293b';
      if (d.topFlapH > 0) {
        ctx2D.fillRect(curX - gapPx / 2, -1, gapPx, topH_px + 2);
        ctx2D.strokeStyle = '#0f172a';
        ctx2D.lineWidth = 1.2;
        ctx2D.strokeRect(curX - gapPx / 2, 0, gapPx, topH_px);
      }
      if (d.botFlapH > 0) {
        ctx2D.fillRect(curX - gapPx / 2, topH_px + h_px - 1, gapPx, botH_px + 2);
        ctx2D.strokeStyle = '#0f172a';
        ctx2D.lineWidth = 1.2;
        ctx2D.strokeRect(curX - gapPx / 2, topH_px + h_px, gapPx, botH_px);
      }
    }

    if (show2DLabels) {
      ctx2D.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx2D.font = 'bold 12px "Be Vietnam Pro", sans-serif';
      const panelName = idx % 2 === 0 ? `L${idx / 2 + 1} (${pw}mm)` : `W${(idx + 1) / 2} (${pw}mm)`;
      ctx2D.fillText(panelName, curX + 10, topH_px + 22);

      ctx2D.font = '10px "Be Vietnam Pro", sans-serif';
      ctx2D.fillStyle = '#b45309';
      if (d.topFlapH > 0) ctx2D.fillText(`Cánh trên: ${d.topFlapH}mm`, curX + 10, topH_px - 8);
      ctx2D.fillText(`Cao H: ${d.H}mm`, curX + 10, topH_px + h_px / 2);
      if (d.botFlapH > 0) ctx2D.fillText(`Cánh đáy: ${d.botFlapH}mm`, curX + 10, topH_px + h_px + 16);
    }

    curX = nextX;
  });

  ctx2D.strokeStyle = '#0f172a';
  ctx2D.lineWidth = 2;
  buildDielineClipPath();
  ctx2D.stroke();

  if (eraserMode && mouseWorldPos2D) {
    const rPx = (eraserSizeMm / 2) * scale;
    ctx2D.save();
    ctx2D.beginPath();
    ctx2D.arc(mouseWorldPos2D.x, mouseWorldPos2D.y, rPx, 0, Math.PI * 2);
    ctx2D.fillStyle = 'rgba(236, 72, 153, 0.22)';
    ctx2D.fill();
    ctx2D.lineWidth = 1.5 / zoom2D;
    ctx2D.strokeStyle = '#ffffff';
    ctx2D.stroke();
    ctx2D.setLineDash([3 / zoom2D, 3 / zoom2D]);
    ctx2D.strokeStyle = '#db2777';
    ctx2D.stroke();
    ctx2D.restore();
  }

  ctx2D.restore();
  ctx2D.restore();
}

function getHandles() {
  const r = getArtRectPx();
  return {
    tl: { x: r.x, y: r.y },
    tr: { x: r.x + r.w, y: r.y },
    bl: { x: r.x, y: r.y + r.h },
    br: { x: r.x + r.w, y: r.y + r.h },
    t: { x: r.x + r.w / 2, y: r.y },
    b: { x: r.x + r.w / 2, y: r.y + r.h },
    l: { x: r.x, y: r.y + r.h / 2 },
    r: { x: r.x + r.w, y: r.y + r.h / 2 }
  };
}

function getCanvasWorldPos(e) {
  const rect = canvas2D.getBoundingClientRect();
  const cw = canvas2D.width, ch = canvas2D.height;
  const metrics = getLayoutMetrics(getDims());

  const clientX = e.clientX - rect.left;
  const clientY = e.clientY - rect.top;

  const xAfterPan = clientX - (cw / 2 + pan2D.x);
  const yAfterPan = clientY - (ch / 2 + pan2D.y);
  const xUnscaled = xAfterPan / zoom2D;
  const yUnscaled = yAfterPan / zoom2D;
  const xFinal = xUnscaled + cw / 2 - metrics.startX;
  const yFinal = yUnscaled + ch / 2 - metrics.startY;

  return { x: xFinal, y: yFinal };
}

let activeTextIndex = -1;
let textDragType = null;

canvas2D.addEventListener('pointerleave', () => {
  mouseWorldPos2D = null;
  if (eraserMode) render2DDieline();
});

canvas2D.addEventListener('pointerdown', e => {
  if (currentMode !== '2d') return;
  const m = getCanvasWorldPos(e);
  mouseWorldPos2D = m;

  if (e.button === 1) {
    activeHandle = 'pan';
    dragStart2D = { x: e.clientX, y: e.clientY, panX: pan2D.x, panY: pan2D.y };
    canvas2D.setPointerCapture(e.pointerId);
    return;
  }

  if (eraserMode) {
    if (loadedArtImg) {
      isErasing = true;
      lastErasePos = null;
      eraseArtworkAt(m);
      lastErasePos = { ...m };
      render2DDieline();
      canvas2D.setPointerCapture(e.pointerId);
    }
    return;
  }

  if (textToolMode) {
    const textVal = document.getElementById('customTextInput').value.trim();
    if (textVal) {
      const color = document.getElementById('textColorPicker').value;
      const fontSize = parseInt(document.getElementById('textSizeSelect').value, 10) || 24;
      const scale = getLayoutMetrics(getDims()).scale;

      customTextItems.push({
        text: textVal,
        x: m.x / scale,
        y: m.y / scale,
        fontSize: fontSize,
        color: color,
        scale: 1.0
      });
      pushHistory();
      render2DDieline();
      setTextToolMode(false);
    }
    return;
  }

  for (let i = customTextItems.length - 1; i >= 0; i--) {
    const item = customTextItems[i];
    if (item._box) {
      const b = item._box;
      const scaleHandleBox = { x: b.x + b.w - 8, y: b.y + b.h - 8, w: 16, h: 16 };
      if (m.x >= scaleHandleBox.x && m.x <= scaleHandleBox.x + scaleHandleBox.w && m.y >= scaleHandleBox.y && m.y <= scaleHandleBox.y + scaleHandleBox.h) {
        activeTextIndex = i;
        textDragType = 'scale';
        dragStart2D = { x: m.x, y: m.y, startScale: item.scale || 1.0 };
        canvas2D.setPointerCapture(e.pointerId);
        return;
      }
      if (m.x >= b.x && m.x <= b.x + b.w && m.y >= b.y && m.y <= b.y + b.h) {
        activeTextIndex = i;
        textDragType = 'move';
        dragStart2D = { x: m.x, y: m.y, startX: item.x, startY: item.y };
        canvas2D.setPointerCapture(e.pointerId);
        return;
      }
    }
  }

  if (loadedArtImg) {
    const handles = getHandles();
    for (let [key, pos] of Object.entries(handles)) {
      if (Math.hypot(m.x - pos.x, m.y - pos.y) < 12 / zoom2D) {
        activeHandle = key;
        dragStart2D = { x: m.x, y: m.y, scale: getArtRectPx().scale, rect: { ...artRect } };
        canvas2D.setPointerCapture(e.pointerId);
        return;
      }
    }

    const rpx = getArtRectPx();
    if (m.x >= rpx.x && m.x <= rpx.x + rpx.w && m.y >= rpx.y && m.y <= rpx.y + rpx.h) {
      activeHandle = 'move';
      dragStart2D = { x: m.x, y: m.y, scale: rpx.scale, rect: { ...artRect } };
      canvas2D.setPointerCapture(e.pointerId);
      return;
    }
  }

  activeHandle = 'pan';
  dragStart2D = { x: e.clientX, y: e.clientY, panX: pan2D.x, panY: pan2D.y };
  canvas2D.setPointerCapture(e.pointerId);
});

canvas2D.addEventListener('pointermove', e => {
  if (currentMode !== '2d') return;
  const m = getCanvasWorldPos(e);
  mouseWorldPos2D = m;

  if (eraserMode) {
    if (isErasing) {
      eraseArtworkAt(m);
      lastErasePos = { ...m };
    }
    render2DDieline();
    return;
  }

  if (activeTextIndex !== -1) {
    const scale = getLayoutMetrics(getDims()).scale;
    const item = customTextItems[activeTextIndex];
    if (textDragType === 'move') {
      const dx = (m.x - dragStart2D.x) / scale;
      const dy = (m.y - dragStart2D.y) / scale;
      item.x = dragStart2D.startX + dx;
      item.y = dragStart2D.startY + dy;
    } else if (textDragType === 'scale') {
      const distStart = Math.hypot(dragStart2D.x - item.x * scale, dragStart2D.y - item.y * scale);
      const distCurrent = Math.hypot(m.x - item.x * scale, m.y - item.y * scale);
      const ratio = distStart > 5 ? distCurrent / distStart : 1.0;
      item.scale = Math.max(0.3, Math.min(5.0, dragStart2D.startScale * ratio));
    }
    render2DDieline();
    return;
  }

  if (!activeHandle) return;

  if (activeHandle === 'pan') {
    pan2D.x = dragStart2D.panX + (e.clientX - dragStart2D.x);
    pan2D.y = dragStart2D.panY + (e.clientY - dragStart2D.y);
    render2DDieline();
    return;
  }

  if (!loadedArtImg) return;
  const dx = (m.x - dragStart2D.x) / dragStart2D.scale;
  const dy = (m.y - dragStart2D.y) / dragStart2D.scale;
  const r = dragStart2D.rect;

  if (activeHandle === 'move') {
    artRect.x = r.x + dx; artRect.y = r.y + dy;
  } else {
    if (activeHandle === 'tl') {
      artRect.x = r.x + dx; artRect.w = r.w - dx; artRect.y = r.y + dy; artRect.h = r.h - dy;
    } else if (activeHandle === 'tr') {
      artRect.w = r.w + dx; artRect.y = r.y + dy; artRect.h = r.h - dy;
    } else if (activeHandle === 'bl') {
      artRect.x = r.x + dx; artRect.w = r.w - dx; artRect.h = r.h + dy;
    } else if (activeHandle === 'br') {
      artRect.w = r.w + dx; artRect.h = r.h + dy;
    } else if (activeHandle === 't') {
      artRect.y = r.y + dy; artRect.h = r.h - dy;
    } else if (activeHandle === 'b') {
      artRect.h = r.h + dy;
    } else if (activeHandle === 'l') {
      artRect.x = r.x + dx; artRect.w = r.w - dx;
    } else if (activeHandle === 'r') {
      artRect.w = r.w + dx;
    }
  }
  artRect.w = Math.max(5, artRect.w);
  artRect.h = Math.max(5, artRect.h);
  render2DDieline();
});

canvas2D.addEventListener('pointerup', () => {
  if (isErasing) {
    isErasing = false;
    lastErasePos = null;
    pushHistory();
  }
  if (activeTextIndex !== -1) {
    activeTextIndex = -1;
    textDragType = null;
    pushHistory();
  }
  if (activeHandle && activeHandle !== 'pan') pushHistory();
  activeHandle = null;
});

canvas2D.addEventListener('wheel', e => {
  if (currentMode !== '2d') return;
  e.preventDefault();
  const rect = canvas2D.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const factor = e.deltaY < 0 ? 1.15 : 0.85;
  const newZoom = Math.max(0.2, Math.min(10, zoom2D * factor));

  const cw = canvas2D.width, ch = canvas2D.height;
  const worldX = (mouseX - (cw / 2 + pan2D.x)) / zoom2D;
  const worldY = (mouseY - (ch / 2 + pan2D.y)) / zoom2D;

  zoom2D = newZoom;
  pan2D.x = mouseX - (cw / 2 + worldX * zoom2D);
  pan2D.y = mouseY - (ch / 2 + worldY * zoom2D);

  render2DDieline();
}, { passive: false });

// --- THREE.JS 3D STUDIO ---

function createPaperTexture(hexColor) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hexColor; ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(70,40,15,0.14)' : 'rgba(255,245,220,0.18)';
    ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2, 2);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createCorrugatedEdgeTexture(hexColor, layers = 5) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hexColor; ctx.fillRect(0, 0, 128, 128);

  const h = 128;
  const stripH = h / layers;
  for (let i = 0; i < layers; i++) {
    if (i % 2 === 0) {
      ctx.fillStyle = '#b08a5e'; ctx.fillRect(0, i * stripH, 128, stripH + 2);
    } else {
      ctx.fillStyle = '#9e7b51'; ctx.fillRect(0, i * stripH, 128, stripH);
      ctx.strokeStyle = '#573c20'; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let x = 0; x <= 128; x += 2) {
        const y = (i + 0.5) * stripH + Math.sin((x / 128) * Math.PI * 10) * 8;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(16, 1);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

let cartonRoot = new THREE.Group();
scene.add(cartonRoot);
let flapControllers = [];
let wallHinges = []; // Chuỗi bản lề thân thùng [W1, L2, W2]
let tsHinge = null;
let topTapeGroup = null, botTapeGroup = null;
let animBotMainDeg = null, animBotSideDeg = null, animTapeProgress = 1.0;

function createPanelMaterial3D(panelIdx, regionType, d) {
  const texCanvas = document.createElement('canvas');
  texCanvas.width = 1024; texCanvas.height = 1024;
  const ctx = texCanvas.getContext('2d');

  const paperColor = document.getElementById('paperColorPicker').value;
  ctx.fillStyle = paperColor;
  ctx.fillRect(0, 0, 1024, 1024);

  if (loadedArtImg) {
    let panelX = d.TS;
    if (panelIdx === 1) panelX = d.TS + d.L;
    else if (panelIdx === 2) panelX = d.TS + d.L + d.W;
    else if (panelIdx === 3) panelX = d.TS + d.L + d.W + d.L;
    const pw = (panelIdx % 2 === 0) ? d.L : d.W;

    let regionY = d.topFlapH, rh = d.H;
    if (regionType === 'top') { regionY = 0; rh = d.topFlapH; }
    else if (regionType === 'bottom') { regionY = d.topFlapH + d.H; rh = d.botFlapH; }

    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    const pxPerMmX = loadedArtImg.width / artRect.w;
    const pxPerMmY = loadedArtImg.height / artRect.h;
    ctx.drawImage(loadedArtImg,
      (panelX - artRect.x) * pxPerMmX,
      (regionY - artRect.y) * pxPerMmY,
      pw * pxPerMmX,
      rh * pxPerMmY,
      0, 0, 1024, 1024
    );
    ctx.restore();
  }

  customTextItems.forEach(item => {
    let panelXStart = d.TS;
    if (panelIdx === 1) panelXStart = d.TS + d.L;
    else if (panelIdx === 2) panelXStart = d.TS + d.L + d.W;
    else if (panelIdx === 3) panelXStart = d.TS + d.L + d.W + d.L;
    const pw = (panelIdx % 2 === 0) ? d.L : d.W;

    let regionYStart = d.topFlapH, rh = d.H;
    if (regionType === 'top') { regionYStart = 0; rh = d.topFlapH; }
    else if (regionType === 'bottom') { regionYStart = d.topFlapH + d.H; rh = d.botFlapH; }

    if (item.x >= panelXStart && item.x < panelXStart + pw && item.y >= regionYStart && item.y < regionYStart + rh) {
      const localX = ((item.x - panelXStart) / pw) * 1024;
      const localY = ((item.y - regionYStart) / rh) * 1024;
      ctx.save();
      const actualSize = item.fontSize * (item.scale || 1.0) * (1024 / Math.max(pw, rh));
      ctx.font = `bold ${Math.max(16, actualSize)}px "Be Vietnam Pro", sans-serif`;
      ctx.fillStyle = item.color || '#0f172a';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillText(item.text, localX, localY);
      ctx.restore();
    }
  });

  const tex = new THREE.CanvasTexture(texCanvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.86 });
}

function buildCarton3D() {
  cartonRoot.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const arr = Array.isArray(obj.material) ? obj.material : [obj.material];
      arr.forEach(m => m.dispose());
    }
  });
  scene.remove(cartonRoot);
  cartonRoot = new THREE.Group();
  scene.add(cartonRoot);
  flapControllers = [];
  wallHinges = [];
  tsHinge = null;
  topTapeGroup = null;
  botTapeGroup = null;

  const d = getDims();
  const { L, W, H, T, TS, topFlapH, botFlapH, slotGap, fluteLayers, tapeWidthMm, tapeOverlapMm } = d;
  const paperColor = document.getElementById('paperColorPicker').value;

  const innerMat = new THREE.MeshStandardMaterial({ map: createPaperTexture(paperColor), roughness: 0.92 });
  const edgeMat = new THREE.MeshStandardMaterial({ map: createCorrugatedEdgeTexture(paperColor, fluteLayers), roughness: 0.95 });

  // SỬA LỖI TỐI CAO CHO BẢN V2.0:
  // 1. Mối nối TS: Đặt tai dán nằm LÙI hẳn vào phía TRONG tường L1 (z = -T/2) và dịch sang phải một khoảng bằng T,
  //    khi gập 90 độ dán vào W2 sẽ NẰM GỌN LỎN TRONG LÒNG THÙNG, TUYỆT ĐỐI KHÔNG BỊ LÒI RA NGOÀI VÀ KHÔNG GÂY CẤN GÓC!
  // 2. Chống hở & đội nắp: Đặt bản lề nắp ngay mép trong (z = -T/2) và định vị offset lớp lót chuẩn xác.
  
  const createWallAssembly = (panelIdx, panelW, isLong) => {
    const group = new THREE.Group();
    const bodyMat = createPanelMaterial3D(panelIdx, 'body', d);
    const bodyBox = new THREE.Mesh(
      new THREE.BoxGeometry(panelW, H, T),
      [edgeMat, edgeMat, edgeMat, edgeMat, bodyMat, innerMat]
    );
    bodyBox.position.set(panelW / 2, H / 2, 0);
    bodyBox.castShadow = true;
    bodyBox.receiveShadow = true;
    group.add(bodyBox);

    const flapW = Math.max(10, panelW - slotGap - 2 * T);

    if (topFlapH > 0) {
      const hinge = new THREE.Group();
      hinge.position.set(panelW / 2, H, -T / 2);
      group.add(hinge);

      const flapMat = createPanelMaterial3D(panelIdx, 'top', d);
      const flapBox = new THREE.Mesh(
        new THREE.BoxGeometry(flapW, topFlapH, T),
        [edgeMat, edgeMat, edgeMat, edgeMat, flapMat, innerMat]
      );
      flapBox.position.set(0, topFlapH / 2, T / 2);
      flapBox.castShadow = true;
      flapBox.receiveShadow = true;
      hinge.add(flapBox);
      flapControllers.push({ hinge, isTop: true, isLong, baseY: H });
    }

    if (botFlapH > 0) {
      const hinge = new THREE.Group();
      hinge.position.set(panelW / 2, 0, -T / 2);
      group.add(hinge);

      const flapMat = createPanelMaterial3D(panelIdx, 'bottom', d);
      const flapBox = new THREE.Mesh(
        new THREE.BoxGeometry(flapW, botFlapH, T),
        [edgeMat, edgeMat, edgeMat, edgeMat, flapMat, innerMat]
      );
      flapBox.position.set(0, -botFlapH / 2, T / 2);
      flapBox.castShadow = true;
      flapBox.receiveShadow = true;
      hinge.add(flapBox);
      flapControllers.push({ hinge, isTop: false, isLong, baseY: 0 });
    }

    return group;
  };

  const wallL1 = createWallAssembly(0, L, true);
  wallL1.position.set(-L / 2, 0, W / 2 - T / 2);
  cartonRoot.add(wallL1);

  if (TS > 0 && H > 6) {
    const effectiveTS = Math.min(TS, Math.max(8, W - T * 2));
    const tabDepth = T * 0.9;
    tsHinge = new THREE.Group();
    // Đặt bản lề tại mép trái L1 và hướng lưỡi gà vào trong thùng.
    tsHinge.position.set(0, H / 2, T / 2);
    wallL1.add(tsHinge);

    const shape = new THREE.Shape();
    const tw = effectiveTS, th = H - 6;
    const bevel = Math.min(th * 0.12, 18);
    shape.moveTo(0, -th / 2);
    shape.lineTo(tw, -th / 2 + bevel);
    shape.lineTo(tw, th / 2 - bevel);
    shape.lineTo(0, th / 2);
    shape.closePath();

    const tabGeo = new THREE.ExtrudeGeometry(shape, {
      depth: tabDepth,
      bevelEnabled: false
    });
    const tabMesh = new THREE.Mesh(tabGeo, innerMat);
    // Chồng lưỡi gà vào mặt trong của tấm W2.
    tabMesh.position.set(0, 0, -tabDepth);
    tabMesh.castShadow = true;
    tsHinge.add(tabMesh);
  }

  const hingeW1 = new THREE.Group();
  hingeW1.position.set(L, 0, 0);
  wallL1.add(hingeW1);
  const wallW1 = createWallAssembly(1, W, false);
  hingeW1.add(wallW1);
  wallHinges.push(hingeW1);

  const hingeL2 = new THREE.Group();
  hingeL2.position.set(W, 0, 0);
  wallW1.add(hingeL2);
  const wallL2 = createWallAssembly(2, L, true);
  hingeL2.add(wallL2);
  wallHinges.push(hingeL2);

  const hingeW2 = new THREE.Group();
  hingeW2.position.set(L, 0, 0);
  wallL2.add(hingeW2);
  const wallW2 = createWallAssembly(3, W, false);
  hingeW2.add(wallW2);
  wallHinges.push(hingeW2);

  const createFoldedTapeGroup = (isTop) => {
    const group = new THREE.Group();
    const isClear = document.getElementById('tapeMode').value === 'clear';
    const tapeColor = document.getElementById('tapeColorPicker').value || '#facc15';
    const tapeMat = new THREE.MeshPhysicalMaterial({
      color: isClear ? 0xfff8e7 : tapeColor,
      transparent: true, opacity: isClear ? 0.35 : 0.92, roughness: 0.18, side: THREE.DoubleSide
    });

    const eps = 0.4;
    const outerSurfaceY = isTop ? (H + T + eps) : -(T + eps);

    const mainGeo = new THREE.PlaneGeometry(L + eps * 2, tapeWidthMm);
    const mainMesh = new THREE.Mesh(mainGeo, tapeMat);
    mainMesh.rotation.x = isTop ? -Math.PI / 2 : Math.PI / 2;
    mainMesh.position.set(0, outerSurfaceY, 0);
    group.add(mainMesh);

    if (tapeOverlapMm > 0) {
      const wrapY = isTop ? (outerSurfaceY - tapeOverlapMm / 2) : (outerSurfaceY + tapeOverlapMm / 2);
      const sideGeo = new THREE.PlaneGeometry(tapeWidthMm, tapeOverlapMm);

      const leftMesh = new THREE.Mesh(sideGeo, tapeMat);
      leftMesh.rotation.y = Math.PI / 2;
      leftMesh.position.set(-(L / 2 + eps), wrapY, 0);
      group.add(leftMesh);

      const rightMesh = new THREE.Mesh(sideGeo, tapeMat);
      rightMesh.rotation.y = Math.PI / 2;
      rightMesh.position.set(L / 2 + eps, wrapY, 0);
      group.add(rightMesh);
    }

    cartonRoot.add(group);
    return group;
  };

  if (topFlapH > 0) topTapeGroup = createFoldedTapeGroup(true);
  if (botFlapH > 0) botTapeGroup = createFoldedTapeGroup(false);

  setBodyFoldFactor(1.0);
  applyFlapAngles();
}

function setBodyFoldFactor(factor) {
  const f = Math.max(0, Math.min(1, factor));
  wallHinges.forEach(h => {
    h.rotation.y = f * (Math.PI / 2);
  });
  if (tsHinge) {
    tsHinge.rotation.y = f * (Math.PI / 2);
  }
}

function applyFlapAngles() {
  const topMainDeg = +document.getElementById('topMainOpen').value;
  const topSideDeg = +document.getElementById('topSideOpen').value;
  const botSliderDeg = +document.getElementById('bottomOpen').value;

  let botSideDeg, botMainDeg;
  if (animBotSideDeg !== null && animBotMainDeg !== null) {
    botSideDeg = animBotSideDeg;
    botMainDeg = animBotMainDeg;
  } else if (botSliderDeg <= 90) {
    botSideDeg = Math.max(0, Math.min(90, (botSliderDeg - 45) * 2));
    botMainDeg = Math.max(0, Math.min(90, botSliderDeg * 2));
  } else {
    botSideDeg = botSliderDeg;
    botMainDeg = botSliderDeg;
  }

  const d = getDims();
  const T = d.T;

  flapControllers.forEach(fc => {
    let openDeg;
    if (fc.isTop) {
      openDeg = fc.isLong ? topMainDeg : topSideDeg;
    } else {
      openDeg = fc.isLong ? botMainDeg : botSideDeg;
    }

    const sign = fc.isTop ? -1 : 1;
    const openRad = THREE.MathUtils.degToRad(openDeg);

    fc.hinge.rotation.x = sign * (Math.PI / 2 - openRad);

    // KỸ THUẬT CHỒNG LỚP NẮP HOÀN HẢO (V2.0):
    // - Cánh phụ (W, isLong=false): Gập sát miệng thùng ở lớp dưới cùng (offset = 0).
    // - Cánh chính (L, isLong=true): Gập đè lên trên cánh phụ, được nâng cao chính xác 1 lớp độ dày giấy (+T).
    // Khi đóng kín (cos=1), cánh chính cao hơn cánh phụ đúng 1 bề dày giấy T, các mặt phẳng khớp khít tuyệt đối, không hở, không đội!
    const closeFactor = Math.max(0, Math.cos(openRad));
    const layerOffsetY = fc.isLong ? (T * closeFactor) : 0;
    fc.hinge.position.y = fc.baseY + (fc.isTop ? 1 : -1) * layerOffsetY;
  });

  const mode = document.getElementById('tapeMode').value;
  const isClear = mode === 'clear';
  const tapeColor = document.getElementById('tapeColorPicker').value || '#facc15';

  if (topTapeGroup) {
    topTapeGroup.visible = (mode !== 'none' && topMainDeg === 0 && topSideDeg === 0 && animTapeProgress > 0.01);
    topTapeGroup.scale.set(Math.max(0.01, animTapeProgress), 1, 1);
  }
  if (botTapeGroup) {
    botTapeGroup.visible = (mode !== 'none' && botMainDeg === 0 && botSideDeg === 0 && animTapeProgress > 0.01);
    botTapeGroup.scale.set(Math.max(0.01, animTapeProgress), 1, 1);
  }

  [topTapeGroup, botTapeGroup].forEach(group => {
    if (!group) return;
    group.children.forEach(mesh => {
      mesh.material.color.set(isClear ? 0xfff8e7 : tapeColor);
      mesh.material.opacity = isClear ? 0.35 : 0.92;
    });
  });
}

// --- CLIP RÁP THÙNG 4 GIAI ĐOẠN CHUẨN KỸ THUẬT ---
let isAnimating = false;
let animProgress = 0;
let animDuration = 7.0;
let animLastTime = null;

const animBar = document.getElementById('animBar');
const animPlayPauseBtn = document.getElementById('animPlayPauseBtn');
const animResetBtn = document.getElementById('animResetBtn');
const animSeekSlider = document.getElementById('animSeekSlider');
const animTimeStatus = document.getElementById('animTimeStatus');

function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function setAnimationProgress(prog) {
  animProgress = Math.max(0, Math.min(1, prog));
  animSeekSlider.value = animProgress * 1000;

  let phaseLabel = '';
  let sideOpenAngle = 90;
  let mainOpenAngle = 90;

  if (animProgress <= 0.32) {
    const tBody = smoothstep(0.0, 0.32, animProgress);
    setBodyFoldFactor(tBody);
    sideOpenAngle = 90;
    mainOpenAngle = 90;
    animTapeProgress = 0;
    phaseLabel = 'Dán mối nối TS & W2';
  } else if (animProgress <= 0.62) {
    setBodyFoldFactor(1.0);
    const tSide = smoothstep(0.32, 0.62, animProgress);
    sideOpenAngle = (1.0 - tSide) * 90;
    mainOpenAngle = 90;
    animTapeProgress = 0;
    phaseLabel = 'Gập 2 cánh phụ W';
  } else if (animProgress <= 0.90) {
    setBodyFoldFactor(1.0);
    const tMain = smoothstep(0.62, 0.90, animProgress);
    sideOpenAngle = 0;
    mainOpenAngle = (1.0 - tMain) * 90;
    animTapeProgress = 0;
    phaseLabel = 'Gập 2 cánh chính L';
  } else {
    setBodyFoldFactor(1.0);
    const tTape = smoothstep(0.90, 1.0, animProgress);
    sideOpenAngle = 0;
    mainOpenAngle = 0;
    animTapeProgress = tTape;
    phaseLabel = 'Dán băng keo niêm phong';
  }

  animTimeStatus.textContent = `${(animProgress * animDuration).toFixed(1)}s • ${phaseLabel}`;

  document.getElementById('topSideOpen').value = sideOpenAngle;
  document.getElementById('topMainOpen').value = mainOpenAngle;
  document.getElementById('bottomOpen').value = Math.round((sideOpenAngle + mainOpenAngle) / 2);

  animBotSideDeg = sideOpenAngle;
  animBotMainDeg = mainOpenAngle;

  applyFlapAngles();
}

document.getElementById('playAnimBtn').onclick = () => {
  if (currentMode !== '3d') {
    document.getElementById('build3DBtn').click();
  }
  animBar.classList.add('visible');
  if (animProgress >= 1.0) animProgress = 0;
  setAnimationProgress(animProgress);
  isAnimating = true;
  animPlayPauseBtn.textContent = '⏸ Tạm dừng';
  animLastTime = performance.now();
};

animPlayPauseBtn.onclick = () => {
  if (!isAnimating && animProgress >= 1.0) {
    animProgress = 0;
  }
  isAnimating = !isAnimating;
  animPlayPauseBtn.textContent = isAnimating ? '⏸ Tạm dừng' : '▶ Tiếp tục';
  if (isAnimating) animLastTime = performance.now();
};

animResetBtn.onclick = () => {
  setAnimationProgress(0);
  isAnimating = true;
  animPlayPauseBtn.textContent = '⏸ Tạm dừng';
  animLastTime = performance.now();
};

animSeekSlider.oninput = e => {
  isAnimating = false;
  animPlayPauseBtn.textContent = '▶ Tiếp tục';
  setAnimationProgress(e.target.value / 1000);
};

document.getElementById('animCloseBtn').onclick = () => {
  isAnimating = false;
  setBodyFoldFactor(1.0);
  animBotSideDeg = null;
  animBotMainDeg = null;
  animTapeProgress = 1.0;
  animBar.classList.remove('visible');
  applyFlapAngles();
};

function updateAnimation(timestamp) {
  if (isAnimating && animBar.classList.contains('visible')) {
    if (!animLastTime) animLastTime = timestamp;
    const dt = (timestamp - animLastTime) / 1000;
    animLastTime = timestamp;

    animProgress += dt / animDuration;
    if (animProgress >= 1.0) {
      animProgress = 1.0;
      isAnimating = false;
      animPlayPauseBtn.textContent = '▶ Phát lại';
    }
    setAnimationProgress(animProgress);
  }
}

function focusCamera(preset = 'iso') {
  const { L, W, H } = getDims();
  const maxDim = Math.max(L, W, H);
  controls.target.set(0, H * 0.48, 0);
  if (preset === 'front') camera.position.set(0, H * 0.55, maxDim * 2.2);
  else if (preset === 'side') camera.position.set(maxDim * 2.2, H * 0.55, 0);
  else if (preset === 'top') camera.position.set(0, maxDim * 2.4, 10);
  else camera.position.set(maxDim * 1.65, maxDim * 1.25, maxDim * 1.85);
  controls.update();
}

const toggleLabelsBtn = document.getElementById('toggle2DLabelsBtn');
const toggleLabelsText = document.getElementById('toggle2DLabelsText');
const eyeIcon = document.getElementById('eyeIcon');

toggleLabelsBtn.onclick = () => {
  show2DLabels = !show2DLabels;
  if (show2DLabels) {
    toggleLabelsText.textContent = 'Ẩn thông số trên bản 2D';
    toggleLabelsBtn.classList.remove('hidden-state');
    eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
  } else {
    toggleLabelsText.textContent = 'Hiện thông số trên bản 2D';
    toggleLabelsBtn.classList.add('hidden-state');
    eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  }
  if (currentMode === '2d') render2DDieline();
};

function clearUploadedArtwork(recordHistory = true) {
  loadedArtImg = null;
  document.getElementById('artInput').value = '';
  if (recordHistory) pushHistory();
  if (currentMode === '2d') resizeCanvas2D(); else buildCarton3D();
}

document.getElementById('clearArtBtn').onclick = () => clearUploadedArtwork(true);

document.getElementById('updateDielineBtn').onclick = () => {
  currentMode = '2d';
  canvas2D.style.display = 'block';
  threeContainer.style.display = 'none';
  document.getElementById('toolbar2D').style.display = 'flex';
  document.getElementById('camToolbar').style.display = 'none';
  document.getElementById('controls3DPanel').style.display = 'none';
  animBar.classList.remove('visible');
  clearUploadedArtwork(true);
};

document.getElementById('build3DBtn').onclick = () => {
  setEraserMode(false);
  setTextToolMode(false);
  animBotSideDeg = null;
  animBotMainDeg = null;
  animTapeProgress = 1.0;
  currentMode = '3d';
  canvas2D.style.display = 'none';
  threeContainer.style.display = 'block';
  document.getElementById('toolbar2D').style.display = 'none';
  document.getElementById('camToolbar').style.display = 'flex';
  document.getElementById('controls3DPanel').style.display = 'block';

  const w = viewArea.clientWidth, h = viewArea.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);

  buildCarton3D();
  focusCamera('iso');
};

const switchTo2D = () => {
  currentMode = '2d';
  canvas2D.style.display = 'block';
  threeContainer.style.display = 'none';
  document.getElementById('toolbar2D').style.display = 'flex';
  document.getElementById('camToolbar').style.display = 'none';
  document.getElementById('controls3DPanel').style.display = 'none';
  animBar.classList.remove('visible');
  resizeCanvas2D();
};
document.getElementById('switchMode2D_bottom').onclick = switchTo2D;

document.getElementById('artInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const offscreen = document.createElement('canvas');
    offscreen.width = img.width; offscreen.height = img.height;
    offscreen.getContext('2d').drawImage(img, 0, 0);
    loadedArtImg = offscreen;

    const geom = getDielineGeometry(getDims());
    artRect = { x: 0, y: 0, w: geom.totalW, h: geom.totalH };
    zoom2D = 1.0; pan2D = { x: 0, y: 0 };
    pushHistory();
    render2DDieline();
    URL.revokeObjectURL(url);
  };
  img.src = url;
});

['L', 'W', 'H', 'thick', 'glueTS', 'topFlapH', 'botFlapH', 'slotGap', 'paperColorPicker', 'fluteLayers', 'tapeWidthMm', 'tapeOverlapMm'].forEach(id => {
  document.getElementById(id).onchange = () => {
    if (currentMode === '2d') render2DDieline(); else buildCarton3D();
  };
});

document.getElementById('paperPreset').onchange = e => {
  document.getElementById('paperColorPicker').value = e.target.value;
  if (currentMode === '2d') render2DDieline(); else buildCarton3D();
};

['topMainOpen', 'topSideOpen', 'bottomOpen'].forEach(id => {
  document.getElementById(id).oninput = () => {
    isAnimating = false;
    setBodyFoldFactor(1.0);
    animBotSideDeg = null;
    animBotMainDeg = null;
    animTapeProgress = 1.0;
    applyFlapAngles();
  };
});

document.getElementById('tapeMode').onchange = e => {
  document.getElementById('tapeColorRow').style.display = e.target.value === 'color' ? 'grid' : 'none';
  applyFlapAngles();
};
document.getElementById('tapeColorPicker').oninput = applyFlapAngles;

document.getElementById('presetStudio').onclick = () => {
  isAnimating = false;
  setBodyFoldFactor(1.0);
  animBotSideDeg = null;
  animBotMainDeg = null;
  animTapeProgress = 1.0;
  document.getElementById('topMainOpen').value = 32;
  document.getElementById('topSideOpen').value = 12;
  document.getElementById('bottomOpen').value = 0;
  applyFlapAngles();
};
document.getElementById('presetClosed').onclick = () => {
  isAnimating = false;
  setBodyFoldFactor(1.0);
  animBotSideDeg = null;
  animBotMainDeg = null;
  animTapeProgress = 1.0;
  document.getElementById('topMainOpen').value = 0;
  document.getElementById('topSideOpen').value = 0;
  document.getElementById('bottomOpen').value = 0;
  applyFlapAngles();
};

document.getElementById('camIso').onclick = () => focusCamera('iso');
document.getElementById('camFront').onclick = () => focusCamera('front');
document.getElementById('camSide').onclick = () => focusCamera('side');
document.getElementById('camTop').onclick = () => focusCamera('top');

document.getElementById('saveBtn').onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = `carton-mockup-${getDims().L}x${getDims().W}x${getDims().H}.png`;
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
};

document.getElementById('toggleOverlay').onclick = () => {
  const c = document.getElementById('overlayContent');
  const b = document.getElementById('toggleOverlay');
  c.style.display = c.style.display === 'none' ? 'block' : 'none';
  b.textContent = c.style.display === 'none' ? 'Mở rộng' : 'Thu gọn';
};

new ResizeObserver(() => {
  if (currentMode === '3d') {
    const w = viewArea.clientWidth, h = viewArea.clientHeight;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  } else {
    resizeCanvas2D();
  }
}).observe(viewArea);

function animate(timestamp) {
  requestAnimationFrame(animate);
  if (currentMode === '3d') {
    updateAnimation(timestamp);
    controls.update();
    renderer.render(scene, camera);
  }
}

window.addEventListener('load', () => {
  pushHistory();
  resizeCanvas2D();
});
pushHistory();
resizeCanvas2D();
animate();
</script>
